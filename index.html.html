<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>Rudra Coloring App</title>
<style>
body{margin:0;background:#1b1f2a;color:#fff;font-family:-apple-system,Arial;height:100vh;display:flex;flex-direction:column}
header{background:#2b3142;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input{border-radius:8px}
button{padding:8px 12px;border:none}
#wrap{flex:1;overflow:auto;background:#111;display:flex;justify-content:center;align-items:center}
canvas{background:#fff;touch-action:none;border:1px solid #555}
.palette{display:flex;gap:6px}
.color{width:28px;height:28px;border-radius:50%;border:2px solid #fff;cursor:pointer}
</style>
</head>
<body>
<header>
<input type="file" id="file" accept=".jpg,.jpeg,.png,image/*">
<button onclick="setTool('fill')">Fill</button>
<button onclick="setTool('brush')">Brush</button>
<button onclick="setTool('glitter')">Glitter</button>
<button onclick="setTool('eraser')">Eraser</button>
<button onclick="undo()">Undo</button>
<button onclick="redo()">Redo</button>
<button onclick="savePNG()">Save PNG</button>
<button onclick="saveJPG()">Save JPG</button>
<input type="range" id="size" min="2" max="50" value="10">
<div class="palette">
<div class="color" style="background:#ff3b30" onclick="color='#ff3b30'"></div>
<div class="color" style="background:#ff9500" onclick="color='#ff9500'"></div>
<div class="color" style="background:#ffcc00" onclick="color='#ffcc00'"></div>
<div class="color" style="background:#34c759" onclick="color='#34c759'"></div>
<div class="color" style="background:#007aff" onclick="color='#007aff'"></div>
<div class="color" style="background:#af52de" onclick="color='#af52de'"></div>
</div>
</header>
<div id="wrap">
<canvas id="c" width="1400" height="900"></canvas>
</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d',{willReadFrequently:true});
ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);

let color='#ff3b30',tool='fill',drawing=false;
let undoStack=[],redoStack=[];

function snap(){
undoStack.push(c.toDataURL());
if(undoStack.length>25) undoStack.shift();
redoStack=[];
}
function restore(url){
let img=new Image();
img.onload=()=>{ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);};
img.src=url;
}
function undo(){
if(!undoStack.length) return;
redoStack.push(c.toDataURL());
restore(undoStack.pop());
}
function redo(){
if(!redoStack.length) return;
undoStack.push(c.toDataURL());
restore(redoStack.pop());
}
function setTool(t){tool=t;}

document.getElementById('file').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f) return;
const img=new Image();
img.onload=()=>{
snap();
c.width=img.width; c.height=img.height;
ctx.drawImage(img,0,0);
};
img.src=URL.createObjectURL(f);
});

function pos(ev){
const r=c.getBoundingClientRect();
const p=ev.touches?ev.touches[0]:ev;
return {
x:(p.clientX-r.left)*(c.width/r.width),
y:(p.clientY-r.top)*(c.height/r.height)
};
}

c.addEventListener('mousedown',start);
c.addEventListener('touchstart',start,{passive:false});
c.addEventListener('mousemove',move);
c.addEventListener('touchmove',move,{passive:false});
window.addEventListener('mouseup',()=>drawing=false);
window.addEventListener('touchend',()=>drawing=false);

function start(e){
e.preventDefault();
const p=pos(e);
snap();

if(tool==='fill'){floodFill(Math.floor(p.x),Math.floor(p.y)); return;}

drawing=true;
drawPoint(p.x,p.y);
}
function move(e){
if(!drawing) return;
e.preventDefault();
const p=pos(e);
drawPoint(p.x,p.y);
}

function drawPoint(x,y){
const s=document.getElementById('size').value;
if(tool==='eraser'){
ctx.fillStyle='white';
ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();
return;
}
ctx.fillStyle=color;
ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();

if(tool==='glitter'){
for(let i=0;i<10;i++){
ctx.fillRect(x+(Math.random()*20-10),y+(Math.random()*20-10),2,2);
}
}
}

function floodFill(x,y){
const img=ctx.getImageData(0,0,c.width,c.height);
const d=img.data;
const idx=(y*c.width+x)*4;
const tr=d[idx],tg=d[idx+1],tb=d[idx+2];

function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
const fill=hex(color);

const st=[[x,y]];
while(st.length){
const q=st.pop(),cx=q[0],cy=q[1];
if(cx<0||cy<0||cx>=c.width||cy>=c.height) continue;
const i=(cy*c.width+cx)*4;
if(Math.abs(d[i]-tr)>25||Math.abs(d[i+1]-tg)>25||Math.abs(d[i+2]-tb)>25) continue;
d[i]=fill[0]; d[i+1]=fill[1]; d[i+2]=fill[2];
st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
}
ctx.putImageData(img,0,0);
}

function savePNG(){
const a=document.createElement('a');
a.download='rudra-coloring.png';
a.href=c.toDataURL('image/png');
a.click();
}
function saveJPG(){
const a=document.createElement('a');
a.download='rudra-coloring.jpg';
a.href=c.toDataURL('image/jpeg',0.95);
a.click();
}
</script>
</body>
</html>
