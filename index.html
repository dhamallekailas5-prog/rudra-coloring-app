<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rudra Colors">
<meta name="theme-color" content="#1a1a2e">
<title>Rudra Coloring App v2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#12121f;--panel:#1e1e35;--panel2:#252540;--accent:#ff6b9d;--accent2:#c084fc;--text:#f0f0ff;--dim:#8888aa;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh;height:100vh;}

/* HEADER */
#header{grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:5px 8px;padding-top:max(5px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid rgba(255,255,255,.07);gap:5px;z-index:30;overflow:hidden;}
#logo{font-family:'Fredoka One',cursive;font-size:19px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;flex-shrink:0;}
#upload-group{display:flex;gap:3px;flex-shrink:0;}
.upload-hbtn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px;min-width:44px;background:var(--panel2);border:none;border-radius:10px;cursor:pointer;}
.upload-hbtn-icon{font-size:16px;line-height:1;}
.upload-hbtn-txt{font-size:7.5px;font-weight:800;color:var(--dim);letter-spacing:.3px;}
.upload-hbtn:active{opacity:.6;}
#header-right{display:flex;gap:3px;align-items:center;flex-shrink:0;}
.hbtn{background:var(--panel2);border:none;color:var(--text);border-radius:10px;padding:6px 7px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:700;flex-shrink:0;-webkit-appearance:none;min-width:36px;min-height:36px;touch-action:manipulation;}
.hbtn:active{opacity:.6;}
.hbtn.off{opacity:.25;pointer-events:none;}
#cur-color-ring{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.5);flex-shrink:0;cursor:pointer;position:relative;overflow:hidden;transition:background .2s;}
#cur-color-ring input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}

/* MIDDLE */
#middle{grid-row:2;display:flex;overflow:hidden;position:relative;}

/* SIDE PANELS */
.side-panel{width:62px;background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px;overflow-y:auto;overflow-x:hidden;flex-shrink:0;z-index:20;touch-action:pan-y;}
.side-panel::-webkit-scrollbar{width:3px;}
.side-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
#left-panel{border-right:1px solid rgba(255,255,255,.06);}
#right-panel{border-left:1px solid rgba(255,255,255,.06);}
.tbtn{width:50px;height:50px;border-radius:13px;background:var(--panel2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:19px;gap:1px;flex-shrink:0;-webkit-appearance:none;transition:border-color .15s,background .15s;touch-action:manipulation;}
.tbtn .lbl{font-size:7.5px;font-weight:800;color:var(--dim);letter-spacing:.3px;}
.tbtn:active{opacity:.55;}
.tbtn.on{background:linear-gradient(135deg,#2d2d5e,#3d2d6e);border-color:var(--accent2);}
.tbtn.on .lbl{color:var(--accent2);}
.sep{width:36px;height:1px;background:rgba(255,255,255,.08);margin:2px 0;flex-shrink:0;}
.slider-box{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;background:var(--panel2);border-radius:11px;width:50px;}
.slider-box label{font-size:7px;font-weight:800;color:var(--dim);text-align:center;line-height:1.2;}
.slider-box input[type=range]{-webkit-appearance:none;width:32px;height:4px;border-radius:2px;outline:none;touch-action:none;}
.slider-box input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);}
#sens{background:linear-gradient(90deg,var(--accent2),var(--accent));}
#opac{background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9));}
#psize{background:linear-gradient(90deg,#86efac,#4caf50);}

/* CANVAS */
#cwrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#1e1e3a 0%,#0d0d1a 100%);touch-action:none;}
#dc,#gc{display:block;position:absolute;left:0;top:0;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.7);pointer-events:none;}
#oc{display:block;position:absolute;left:0;top:0;border-radius:4px;pointer-events:none;z-index:5;}
#wc{display:none;}

/* overlay for movable objects */
#obj-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:6;}

/* EMPTY STATE */
#uscreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;pointer-events:none;}
#uscreen.gone{display:none;}
#uscreen-inner{text-align:center;padding:22px 26px;background:rgba(30,30,52,.8);border-radius:20px;border:2px dashed rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#uscreen-inner h2{font-family:'Fredoka One',cursive;font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
#uscreen-inner p{color:var(--dim);font-size:12px;font-weight:600;}

/* BOTTOM PALETTE — FIXED SCROLL */
#bbar{
  grid-row:3;background:var(--panel);border-top:1px solid rgba(255,255,255,.06);
  padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:6px;
  overflow-x:scroll;-webkit-overflow-scrolling:touch;
  flex-shrink:0;z-index:20;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;
  touch-action:pan-x;
}
#bbar::-webkit-scrollbar{height:3px;}
#bbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .1s,border-color .1s;touch-action:manipulation;}
.sw:active{transform:scale(.82);}
.sw.on{border-color:#fff;transform:scale(1.18);}
#ccbtn{width:36px;height:36px;border-radius:50%;border:3px dashed rgba(255,255,255,.4);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;touch-action:manipulation;}
#ccbtn:active{opacity:.7;}
#ccbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}

/* POPUP PANEL */
.popup-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--panel);border-top:2px solid rgba(255,255,255,.1);
  border-radius:20px 20px 0 0;padding:12px 10px 24px;
  z-index:40;transform:translateY(100%);transition:transform .3s ease;
  max-height:65%;display:flex;flex-direction:column;gap:8px;
}
.popup-panel.open{transform:translateY(0);}
.popup-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;flex-shrink:0;}
.popup-header h3{font-family:'Fredoka One',cursive;font-size:17px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.popup-close{background:var(--panel2);border:none;color:var(--text);border-radius:10px;padding:5px 10px;font-size:15px;cursor:pointer;-webkit-appearance:none;touch-action:manipulation;}
.popup-close:active{opacity:.6;}
.tab-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;flex-shrink:0;touch-action:pan-x;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:4px 10px;font-size:11px;font-weight:800;color:var(--dim);cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-appearance:none;touch-action:manipulation;}
.tab-btn.on{border-color:var(--accent2);color:var(--accent2);}
.tab-btn:active{opacity:.6;}
.item-grid{display:flex;flex-wrap:wrap;gap:7px;overflow-y:auto;padding:4px 2px;touch-action:pan-y;}

/* sticker/emoji items */
.stk,.emj{width:50px;height:50px;border-radius:12px;background:var(--panel2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .1s;-webkit-appearance:none;touch-action:manipulation;}
.stk:active,.emj:active{transform:scale(.85);}
.stk.on,.emj.on{border-color:var(--accent);transform:scale(1.1);}

/* shape items */
.shp{width:56px;height:56px;border-radius:12px;background:var(--panel2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .1s;-webkit-appearance:none;touch-action:manipulation;}
.shp:active{transform:scale(.85);}
.shp.on{border-color:var(--accent);background:#3d2d6e;}
.shp svg{width:32px;height:32px;fill:none;stroke:#f0f0ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* blank page thumbnails */
.blank-card{width:72px;background:var(--panel2);border:2px solid rgba(255,255,255,.1);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;cursor:pointer;flex-shrink:0;transition:border-color .15s,transform .1s;touch-action:manipulation;}
.blank-card:active{transform:scale(.92);}
.blank-card.on{border-color:var(--accent2);}
.blank-card .thumb{width:48px;height:60px;border-radius:6px;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;}
.blank-card .clbl{font-size:8.5px;font-weight:800;color:var(--dim);text-align:center;line-height:1.2;}

/* bg picker inline */
#bg-grid{display:flex;flex-wrap:wrap;gap:8px;overflow-y:auto;padding:4px 2px;}
.bgc{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s;touch-action:manipulation;}
.bgc:active{transform:scale(.85);}
.bgc.on{border-color:#fff;transform:scale(1.12);}

/* BACKDROP */
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none;}
#backdrop.show{display:block;}

/* TOAST */
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(18,18,40,.97);color:#fff;padding:9px 18px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:99;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* SPINNER */
#spin{position:fixed;inset:0;background:rgba(10,10,20,.88);display:flex;align-items:center;justify-content:center;z-index:200;}
#spin.gone{display:none;}
.ring{width:48px;height:48px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

/* BRUSH CURSOR */
#bcur{position:fixed;pointer-events:none;border-radius:50%;z-index:50;display:none;transform:translate(-50%,-50%);}

/* MOVABLE OBJECT */
.mob{position:absolute;cursor:grab;touch-action:none;transform-origin:center center;}
.mob:active{cursor:grabbing;}
.mob.selected{outline:2px dashed rgba(255,180,255,.8);outline-offset:4px;}
.mob-inner{pointer-events:none;display:flex;align-items:center;justify-content:center;}
.mob-handle{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent2);border:2px solid #fff;cursor:nwse-resize;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:10;touch-action:none;}
.mob-handle.rot{cursor:crosshair;background:var(--accent);}
.mob-del{position:absolute;top:-12px;right:-12px;width:22px;height:22px;border-radius:50%;background:#e74c3c;border:2px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:10;touch-action:manipulation;}
.mob .mob-del,.mob .mob-handle{display:none;}
.mob.selected .mob-del,.mob.selected .mob-handle{display:flex;}

/* TEXT POPUP */
#text-panel .text-preview{min-height:48px;background:var(--panel2);border-radius:10px;padding:10px;font-size:20px;text-align:center;word-break:break-all;}
.font-opt{padding:6px 12px;background:var(--panel2);border:2px solid transparent;border-radius:8px;cursor:pointer;font-size:14px;touch-action:manipulation;}
.font-opt.on{border-color:var(--accent);}
.clr-opt{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
.clr-opt.on{border-color:#fff;transform:scale(1.15);}

/* FILL MODE TABS */
.fill-tabs{display:flex;gap:5px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.fill-tabs::-webkit-scrollbar{display:none;}
.fill-tab{padding:4px 10px;border-radius:8px;background:var(--panel2);border:2px solid transparent;font-size:11px;font-weight:800;color:var(--dim);cursor:pointer;white-space:nowrap;touch-action:manipulation;}
.fill-tab.on{border-color:var(--accent2);color:var(--accent2);}
</style>
</head>
<body>
<div id="app">

<!-- HEADER -->
<div id="header">
  <div id="logo">🎨 Rudra</div>
  <div id="upload-group">
    <label class="upload-hbtn">
      <span class="upload-hbtn-icon">🖼️</span><span class="upload-hbtn-txt">Photos</span>
      <input type="file" id="hfile-photos" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
    </label>
    <label class="upload-hbtn">
      <span class="upload-hbtn-icon">📁</span><span class="upload-hbtn-txt">Files</span>
      <input type="file" id="hfile-files" accept="image/png,image/jpeg,image/jpg" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
    </label>
    <label class="upload-hbtn">
      <span class="upload-hbtn-icon">📷</span><span class="upload-hbtn-txt">Camera</span>
      <input type="file" id="hfile-camera" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
    </label>
  </div>
  <div id="header-right">
    <div id="cur-color-ring"><input type="color" id="ccin" value="#111111"></div>
    <button class="hbtn off" id="bundo">↩️</button>
    <button class="hbtn off" id="bredo">↪️</button>
    <button class="hbtn" id="bfit">⛶</button>
    <button class="hbtn" id="brotate" title="Rotate Image">🔄</button>
    <button class="hbtn" id="bsave">💾</button>
    <button class="hbtn" id="bclear">🗑️</button>
    <button class="hbtn" id="bnewimg">🔃</button>
  </div>
</div>

<!-- MIDDLE -->
<div id="middle">

  <!-- LEFT PANEL -->
  <div class="side-panel" id="left-panel">
    <button class="tbtn" data-tool="fill" id="btn-fill">🪣<span class="lbl">FILL</span></button>
    <button class="tbtn on" data-tool="pencil">✏️<span class="lbl">PENCIL</span></button>
    <button class="tbtn" data-tool="brush-sm">🖌<span class="lbl">SML</span></button>
    <button class="tbtn" data-tool="brush-md">🖌<span class="lbl">MED</span></button>
    <button class="tbtn" data-tool="brush-lg">🖌<span class="lbl">LRG</span></button>
    <div class="sep"></div>
    <button class="tbtn" data-tool="glitter-gold">✨<span class="lbl">GOLD</span></button>
    <button class="tbtn" data-tool="glitter-silver">⭐<span class="lbl">SLVR</span></button>
    <button class="tbtn" data-tool="glitter-rainbow">🌈<span class="lbl">BOW</span></button>
    <div class="sep"></div>
    <button class="tbtn" data-tool="shape" id="btn-shape">🔷<span class="lbl">SHAPE</span></button>
    <button class="tbtn" data-tool="sticker" id="btn-sticker">🧸<span class="lbl">STCKR</span></button>
    <button class="tbtn" data-tool="emoji" id="btn-emoji">😊<span class="lbl">EMOJI</span></button>
    <button class="tbtn" data-tool="text" id="btn-text">🔤<span class="lbl">TEXT</span></button>
    <button class="tbtn" data-tool="select" id="btn-select">☝️<span class="lbl">MOVE</span></button>
    <div class="sep"></div>
    <button class="tbtn" id="btn-enhance">🔍<span class="lbl">ENHANCE</span></button>
    <button class="tbtn" data-tool="eraser">🧹<span class="lbl">ERASE</span></button>
  </div>

  <!-- CANVAS AREA -->
  <div id="cwrap">
    <canvas id="dc"></canvas>
    <canvas id="gc"></canvas>
    <canvas id="oc"></canvas>
    <canvas id="wc"></canvas>
    <div id="obj-layer"></div>

    <!-- empty state -->
    <div id="uscreen">
      <div id="uscreen-inner">
        <div style="font-size:52px;margin-bottom:10px;">🎨</div>
        <h2>Rudra Coloring!</h2>
        <p>Use Photos · Files · Camera above<br>or tap <b style="color:var(--accent2)">📄 Blank</b> on the right to draw!</p>
      </div>
    </div>

    <!-- STICKER PANEL -->
    <div class="popup-panel" id="sticker-panel">
      <div class="popup-header"><h3>🧸 Stickers</h3><button class="popup-close" id="sticker-close">✕</button></div>
      <div class="tab-row" id="sticker-cats"></div>
      <div class="item-grid" id="sticker-grid"></div>
    </div>

    <!-- EMOJI PANEL -->
    <div class="popup-panel" id="emoji-panel">
      <div class="popup-header"><h3>😊 Emojis</h3><button class="popup-close" id="emoji-close">✕</button></div>
      <div class="tab-row" id="emoji-cats"></div>
      <div class="item-grid" id="emoji-grid"></div>
    </div>

    <!-- SHAPE PANEL -->
    <div class="popup-panel" id="shape-panel">
      <div class="popup-header"><h3>🔷 Shapes</h3><button class="popup-close" id="shape-close">✕</button></div>
      <div class="item-grid" id="shape-grid" style="justify-content:flex-start;"></div>
    </div>

    <!-- TEXT PANEL -->
    <div class="popup-panel" id="text-panel">
      <div class="popup-header"><h3>🔤 Add Text</h3><button class="popup-close" id="text-close">✕</button></div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
        <input id="text-input" type="text" placeholder="Type here..." style="flex:1;background:var(--panel2);border:2px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;color:var(--text);font-size:15px;outline:none;font-family:'Nunito',sans-serif;">
        <button id="text-place-btn" style="background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;touch-action:manipulation;">Place ✓</button>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;" id="font-row"></div>
      <div style="display:flex;gap:4px;flex-shrink:0;align-items:center;">
        <span style="font-size:11px;color:var(--dim);font-weight:800;">SIZE</span>
        <input type="range" id="text-size" min="16" max="120" value="48" style="-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));outline:none;">
        <span id="text-size-val" style="font-size:11px;color:var(--dim);min-width:28px;text-align:right;">48</span>
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;" id="text-color-row"></div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button id="tbold" class="font-opt" style="font-weight:900;">B</button>
        <button id="tunder" class="font-opt" style="text-decoration:underline;">U</button>
        <button id="titalic" class="font-opt" style="font-style:italic;">I</button>
      </div>
      <div id="text-preview" class="text-preview" style="font-size:24px;"></div>
    </div>

    <!-- BLANK PAGE PANEL -->
    <div class="popup-panel" id="blank-panel">
      <div class="popup-header"><h3>📄 Blank Pages</h3><button class="popup-close" id="blank-close">✕</button></div>
      <div class="item-grid" id="blank-grid" style="justify-content:flex-start;gap:10px;"></div>
    </div>

    <!-- BG PICKER PANEL -->
    <div class="popup-panel" id="bg-panel">
      <div class="popup-header"><h3>🎨 Background</h3><button class="popup-close" id="bg-close">✕</button></div>
      <div id="bg-grid"></div>
    </div>

    <!-- FILL MODE PANEL -->
    <div class="popup-panel" id="fill-panel">
      <div class="popup-header"><h3>🪣 Fill Mode</h3><button class="popup-close" id="fill-close">✕</button></div>
      <div class="fill-tabs" id="fill-tabs">
        <button class="fill-tab on" data-fill="solid">🎨 Solid</button>
        <button class="fill-tab" data-fill="gradient">🌈 Gradient</button>
        <button class="fill-tab" data-fill="glitter">✨ Glitter</button>
        <button class="fill-tab" data-fill="texture">🧩 Texture</button>
      </div>
      <!-- Gradient options -->

(function buildPalette(){
  const bar=document.getElementById('bbar');
  const ccbtn=document.getElementById('ccbtn');
  PALETTE.forEach(hex=>{
    const d=document.createElement('div');
    d.className='sw';d.style.background=hex;d.dataset.c=hex;
    if(hex===S.color)d.classList.add('on');
    d.addEventListener('pointerdown',e=>{e.stopPropagation();pickColor(hex);},{passive:true});
    bar.insertBefore(d,ccbtn);
  });
})();
function pickColor(hex){
  S.color=hex;
  document.getElementById('ccin').value=hex;
  document.getElementById('ccin2').value=hex;
  curColorRing.style.background=hex;
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c===hex));
}

    this.value='';
  });
});
function loadFile(file){
  spin.classList.remove('gone');
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    S.origImg=img;S.origW=img.naturalWidth;S.origH=img.naturalHeight;
    S.bgColor='#ffffff';S.isBlankMode=false;S.imageRotation=0;
    setupCanvas();
    spin.classList.add('gone');
    uscreen.classList.add('gone');
    showToast('Image loaded! Start coloring 🎨');
  };
  img.onerror=()=>{spin.classList.add('gone');showToast('Could not load image');};
  img.src=url;
}

document.getElementById('brotate').addEventListener('pointerdown',e=>{
  e.stopPropagation();
  if(!S.origImg&&!S.isBlankMode){showToast('Load an image first!');return;}
  rotateCanvas90();
},{passive:false});
function rotateCanvas90(){
  spin.classList.remove('gone');
  setTimeout(()=>{
    const tmp=document.createElement('canvas');
    tmp.width=wc.height;tmp.height=wc.width;
    const tc=tmp.getContext('2d');
    tc.translate(tmp.width/2,tmp.height/2);
    tc.rotate(Math.PI/2);
    tc.drawImage(wc,-wc.width/2,-wc.height/2);
    // swap dimensions
    const nw=S.canvasH,nh=S.canvasW;
    S.canvasW=nw;S.canvasH=nh;
    S.origW=nw;S.origH=nh;
    wc.width=nw;wc.height=nh;
    dc.width=nw;dc.height=nh;
    gc.width=nw;gc.height=nh;
    oc.width=nw;oc.height=nh;
    dc.style.width=nw+'px';dc.style.height=nh+'px';
    gc.style.width=nw+'px';gc.style.height=nh+'px';
    oc.style.width=nw+'px';oc.style.height=nh+'px';
    wctx.drawImage(tmp,0,0);
    // Update origImg to new rotated version
    const img=new Image();
    img.onload=()=>{S.origImg=img;};
    img.src=tmp.toDataURL();
    applyXform();redraw();pushHist();
    spin.classList.add('gone');
    showToast('Rotated 90° 🔄');
  },60);
}

function openBlankPage(pg){
  const ww=cwrap.clientWidth,wh=cwrap.clientHeight;
  const dw=Math.round(Math.min(1600,ww*0.97));
  const dh=Math.round(dw*1.414);
  const ch=Math.min(dh,Math.round(wh*0.97));
  S.origImg=null;S.isBlankMode=true;
  S.bgColor=pg.bg;S.origW=dw;S.origH=ch;
  S.canvasW=dw;S.canvasH=ch;
  wc.width=dw;wc.height=ch;
  dc.width=dw;dc.height=ch;
  gc.width=dw;gc.height=ch;
  oc.width=dw;oc.height=ch;
  dc.style.width=dw+'px';dc.style.height=ch+'px';
  gc.style.width=dw+'px';gc.style.height=ch+'px';
  oc.style.width=dw+'px';oc.style.height=ch+'px';
  wctx.fillStyle=pg.bg;wctx.fillRect(0,0,dw,ch);
  drawBlankPattern(pg,dw,ch);
  OBJECTS=[];renderObjects();
  S.zoom=1;S.tx=0;S.ty=0;
  applyXform();redraw();
  S.hist=[];S.hi=-1;pushHist();
  uscreen.classList.add('gone');
  setTool('pencil');
  showToast('Blank page ready — draw away! ✏️');
}
function drawBlankPattern(pg,w,h){
  if(!pg.lines)return;
  const lineColor=pg.bg==='#1a1a2e'||pg.bg==='#1a3a2a'?'rgba(255,255,255,.15)':'rgba(0,0,0,.12)';
  const dotColor=pg.bg==='#1a1a2e'||pg.bg==='#1a3a2a'?'rgba(255,255,255,.25)':'rgba(0,0,0,.2)';
  wctx.save();
  if(pg.lines==='h'){
    wctx.strokeStyle=lineColor;wctx.lineWidth=1.5;
    const spacing=Math.round(h/20);
    for(let y=spacing*3;y<h;y+=spacing){wctx.beginPath();wctx.moveTo(40,y);wctx.lineTo(w-20,y);wctx.stroke();}
    wctx.strokeStyle='rgba(255,100,100,.3)';wctx.lineWidth=2;
    wctx.beginPath();wctx.moveTo(80,0);wctx.lineTo(80,h);wctx.stroke();
  } else if(pg.lines==='grid'){
    wctx.strokeStyle=lineColor;wctx.lineWidth=1;
    const sp=Math.round(w/20);
    for(let x=sp;x<w;x+=sp){wctx.beginPath();wctx.moveTo(x,0);wctx.lineTo(x,h);wctx.stroke();}
    for(let y=sp;y<h;y+=sp){wctx.beginPath();wctx.moveTo(0,y);wctx.lineTo(w,y);wctx.stroke();}
  } else if(pg.lines==='dots'){
    wctx.fillStyle=dotColor;
    const sp=Math.round(w/20);
    for(let x=sp;x<w;x+=sp)for(let y=sp;y<h;y+=sp){wctx.beginPath();wctx.arc(x,y,2,0,Math.PI*2);wctx.fill();}
  }
  wctx.restore();
}

// ══════════════════════════════════════════════════
// CANVAS SETUP
// ══════════════════════════════════════════════════
function setupCanvas(){
  const ww=cwrap.clientWidth,wh=cwrap.clientHeight;
  let dw=S.origW,dh=S.origH;
  const mx=Math.min(1800,ww*0.97,wh*0.97);
  if(dw>mx||dh>mx){const r=Math.min(mx/dw,mx/dh);dw=Math.round(dw*r);dh=Math.round(dh*r);}
  S.canvasW=dw;S.canvasH=dh;
  wc.width=dw;wc.height=dh;
  wctx.fillStyle=S.bgColor;wctx.fillRect(0,0,dw,dh);
  wctx.drawImage(S.origImg,0,0,dw,dh);
  dc.width=dw;dc.height=dh;
  gc.width=dw;gc.height=dh;
  oc.width=dw;oc.height=dh;
  dc.style.width=dw+'px';dc.style.height=dh+'px';
  gc.style.width=dw+'px';gc.style.height=dh+'px';
  oc.style.width=dw+'px';oc.style.height=dh+'px';
  OBJECTS=[];renderObjects();
  S.zoom=1;S.tx=0;S.ty=0;
  applyXform();redraw();
  S.hist=[];S.hi=-1;pushHist();
}
function redraw(){
  if(!wc.width)return;
  dctx.clearRect(0,0,dc.width,dc.height);
  dctx.drawImage(wc,0,0);
}
function applyXform(){
  if(!S.canvasW)return;
  const z=S.zoom,dw=S.canvasW,dh=S.canvasH;
  const cx=cwrap.clientWidth/2,cy=cwrap.clientHeight/2;
  const l=cx-dw*z/2+S.tx,t=cy-dh*z/2+S.ty;
  const ts=`translate(${l}px,${t}px) scale(${z})`;
  dc.style.transform=ts;dc.style.transformOrigin='0 0';
  gc.style.transform=ts;gc.style.transformOrigin='0 0';
  oc.style.transform=ts;oc.style.transformOrigin='0 0';
  // Sync object layer
  objLayer.style.transform=ts;objLayer.style.transformOrigin='0 0';
  objLayer.style.width=S.canvasW+'px';
  objLayer.style.height=S.canvasH+'px';
}

// ══════════════════════════════════════════════════
// COORD MAPPING
// ══════════════════════════════════════════════════
function p2c(cx,cy){
  const z=S.zoom,dw=S.canvasW,dh=S.canvasH;
  const mx=cwrap.clientWidth/2,my=cwrap.clientHeight/2;
  const l=mx-dw*z/2+S.tx,t=my-dh*z/2+S.ty;
  const r=cwrap.getBoundingClientRect();
  return{x:Math.round((cx-r.left-l)/z),y:Math.round((cy-r.top-t)/z)};
}
function inB(x,y){return x>=0&&y>=0&&x<wc.width&&y<wc.height;}

// ══════════════════════════════════════════════════
// FLOOD FILL
// ══════════════════════════════════════════════════
function h2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function floodFill(sx,sy){
  if(!inB(sx,sy))return;
  const id=wctx.getImageData(0,0,wc.width,wc.height);
  const d=id.data,W=wc.width,H=wc.height;
  const i0=(sx+sy*W)*4;
  const tr=d[i0],tg=d[i0+1],tb=d[i0+2];
  if(tr<50&&tg<50&&tb<50&&!S.isBlankMode)return;
  const thr=Math.round(S.sensitivity*4.4);
  const vis=new Uint8Array(W*H);
  const stk=[sx+sy*W];vis[stk[0]]=1;
  const fa=Math.round(S.opacity*255);

  // Collect fill region pixels first
  const region=[];
  while(stk.length){
    const p=stk.pop();
    const x=p%W,y=(p/W)|0;
    region.push(p);
    const nb=[p-1,p+1,p-W,p+W];
    for(let n=0;n<4;n++){
      const np=nb[n];if(np<0||np>=W*H||vis[np])continue;
      if(n===0&&x===0)continue;if(n===1&&x===W-1)continue;
      vis[np]=1;const ni=np*4;
      if(!S.isBlankMode&&d[ni]<50&&d[ni+1]<50&&d[ni+2]<50)continue;
      if(Math.abs(d[ni]-tr)+Math.abs(d[ni+1]-tg)+Math.abs(d[ni+2]-tb)<=thr)stk.push(np);
    }
  }

  if(S.fillMode==='solid'){
    const [fr,fg,fb]=h2rgb(S.color);
    region.forEach(p=>{const i=p*4;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=fa;});
  } else if(S.fillMode==='gradient'){
    // compute bbox
    let minX=W,maxX=0,minY=H,maxY=0;
    region.forEach(p=>{const x=p%W,y=(p/W)|0;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;});
    const [r1,g1,b1]=h2rgb(S.color);
    const [r2,g2,b2]=h2rgb(S.gradColor2);
    region.forEach(p=>{
      const x=p%W,y=(p/W)|0,i=p*4;
      let t;
      if(S.gradDir==='h')t=(maxX===minX)?0.5:(x-minX)/(maxX-minX);
      else if(S.gradDir==='v')t=(maxY===minY)?0.5:(y-minY)/(maxY-minY);
      else if(S.gradDir==='d')t=((x-minX)/(maxX-minX||1)+(y-minY)/(maxY-minY||1))/2;
      else{const cx2=(minX+maxX)/2,cy2=(minY+maxY)/2,mx2=Math.max(maxX-cx2,maxY-cy2)||1;t=Math.min(1,Math.hypot(x-cx2,y-cy2)/mx2);}
      d[i]=Math.round(r1*(1-t)+r2*t);d[i+1]=Math.round(g1*(1-t)+g2*t);d[i+2]=Math.round(b1*(1-t)+b2*t);d[i+3]=fa;
    });
  } else if(S.fillMode==='glitter'){
    const gTypes={
      gold:()=>({r:200+Math.random()*55,g:150+Math.random()*80,b:0+Math.random()*60}),
      silver:()=>({r:150+Math.random()*100,g:150+Math.random()*100,b:150+Math.random()*100}),
      rainbow:()=>{const h=Math.random()*360;return hslToRgb(h,100,60);},
      color:()=>{const[r,g,b]=h2rgb(S.color);return{r:r+Math.round((Math.random()-.5)*60),g:g+Math.round((Math.random()-.5)*60),b:b+Math.round((Math.random()-.5)*60)};}
    };
    const gfn=gTypes[S.glitterType]||gTypes.gold;
    region.forEach(p=>{
      const i=p*4,{r,g,b}=gfn();
      d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));d[i+3]=fa;
    });
  } else if(S.fillMode==='texture'){
    const [br,bg2,bb]=h2rgb(S.color);
    region.forEach(p=>{
      const x=p%W,y=(p/W)|0,i=p*4;
      const inTx=isTexturePixel(x,y,S.textureType);
      if(inTx){d[i]=br;d[i+1]=bg2;d[i+2]=bb;d[i+3]=fa;}
      else{const bgc=S.bgColor?h2rgb(S.bgColor):[255,255,255];d[i]=bgc[0];d[i+1]=bgc[1];d[i+2]=bgc[2];d[i+3]=fa;}
    });
  }
  wctx.putImageData(id,0,0);
}
function isTexturePixel(x,y,type){
  switch(type){
    case'dots':return(x%8<3)&&(y%8<3);
    case'lines':return y%6<2;
    case'cross':return(y%8<2)||(x%8<2);
    case'zigzag':{const row=Math.floor(y/6);return(x+row*3)%6<2;}
    case'scale':{const row=Math.floor(y/8),col=Math.floor((x+(row%2)*4)/8);const dx=(x+(row%2)*4)%8,dy=y%8;return Math.hypot(dx-4,dy-4)<4&&dy<4;}
    case'brick':{const row=Math.floor(y/8),off=(row%2)*8;return y%8===0||(x+off)%16===0;}
    case'stars':{const sx=x%16-8,sy=y%16-8;return Math.abs(sx)+Math.abs(sy)<4;}
    case'wave':return Math.abs(Math.sin(x/6)*4-(y%12-6))<1.5;
    default:return true;
  }
}
function hslToRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return{r:Math.round(f(0)*255),g:Math.round(f(8)*255),b:Math.round(f(4)*255)};}

// ══════════════════════════════════════════════════
// AUTO LINE ENHANCEMENT
// ══════════════════════════════════════════════════
function autoEnhance(){
  if(!wc.width)return;
  spin.classList.remove('gone');
  setTimeout(()=>{
    try{
      const id=wctx.getImageData(0,0,wc.width,wc.height);
      const d=id.data,W=wc.width,H=wc.height;
      // Step 1: boost contrast for dark pixels (detect outlines)
      for(let i=0;i<d.length;i+=4){
        const lum=(d[i]+d[i+1]+d[i+2])/3;
        if(lum<80){d[i]=0;d[i+1]=0;d[i+2]=0;} // darken outlines
        else if(lum>180){d[i]=Math.min(255,d[i]+20);d[i+1]=Math.min(255,d[i+1]+20);d[i+2]=Math.min(255,d[i+2]+20);}
      }
      // Step 2: close tiny gaps — if a pixel is light but surrounded mostly by dark, darken it
      const tmp=new Uint8ClampedArray(d);
      for(let y=1;y<H-1;y++){for(let x=1;x<W-1;x++){
        const i=(y*W+x)*4;
        const lum=(tmp[i]+tmp[i+1]+tmp[i+2])/3;
        if(lum>120){
          let darkCount=0;
          const nb=[-1,1,-W,W,-W-1,-W+1,W-1,W+1];
          nb.forEach(n=>{const ni=(y*W+x+n)*4;if(n>=-W*H&&n<W*H&&(tmp[ni]+tmp[ni+1]+tmp[ni+2])/3<80)darkCount++;});
          if(darkCount>=6){d[i]=0;d[i+1]=0;d[i+2]=0;}
        }
      }}
      wctx.putImageData(id,0,0);
      redraw();pushHist();
      spin.classList.add('gone');
      showToast('Lines enhanced! 🔍');
    }catch(e){spin.classList.add('gone');showToast('Enhancement failed');}
  },80);
}

// ══════════════════════════════════════════════════
// PENCIL / BRUSH
// ══════════════════════════════════════════════════
function pencilDot(x,y){
  const r=S.penSize/2;
  wctx.save();wctx.globalAlpha=S.opacity*0.85;wctx.fillStyle=S.color;
  wctx.beginPath();wctx.arc(x,y,r,0,Math.PI*2);wctx.fill();
  if(r>2){wctx.globalAlpha=S.opacity*0.3;for(let i=0;i<3;i++){const ox=(Math.random()-.5)*r*1.5,oy=(Math.random()-.5)*r*1.5;wctx.beginPath();wctx.arc(x+ox,y+oy,r*0.4,0,Math.PI*2);wctx.fill();}}
  wctx.restore();
}
function pencilLine(x0,y0,x1,y1){const dist=Math.hypot(x1-x0,y1-y0);const steps=Math.max(1,Math.ceil(dist/(S.penSize/4)));for(let i=0;i<=steps;i++)pencilDot(x0+(x1-x0)*i/steps,y0+(y1-y0)*i/steps);}
function dot(x,y,r,col,erase){wctx.save();wctx.globalAlpha=erase?1:S.opacity;wctx.fillStyle=erase?(S.bgColor||'#ffffff'):col;wctx.beginPath();wctx.arc(x,y,r,0,Math.PI*2);wctx.fill();wctx.restore();}
function strokeLine(x0,y0,x1,y1,r,col,erase){const d=Math.hypot(x1-x0,y1-y0),steps=Math.max(1,Math.ceil(d/(r/3)));for(let i=0;i<=steps;i++)dot(x0+(x1-x0)*i/steps,y0+(y1-y0)*i/steps,r,col,erase);}

let shapeStart=null;
function drawShapePreview(x0,y0,x1,y1){redraw();dctx.save();dctx.strokeStyle=S.color;dctx.lineWidth=S.penSize;dctx.globalAlpha=S.opacity;dctx.lineCap='round';dctx.lineJoin='round';drawShapePath(dctx,S.selectedShape,x0,y0,x1,y1);dctx.restore();}
function commitShape(x0,y0,x1,y1){wctx.save();wctx.strokeStyle=S.color;wctx.lineWidth=S.penSize;wctx.globalAlpha=S.opacity;wctx.lineCap='round';wctx.lineJoin='round';drawShapePath(wctx,S.selectedShape,x0,y0,x1,y1);wctx.restore();redraw();pushHist();}
function drawShapePath(ctx,shape,x0,y0,x1,y1){
  const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.abs(x1-x0)/2,ry=Math.abs(y1-y0)/2,r=Math.min(rx,ry);
  ctx.beginPath();
  switch(shape){
    case'circle':ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();break;
    case'rect':ctx.rect(x0,y0,x1-x0,y1-y0);ctx.stroke();break;
    case'roundrect':roundRect(ctx,x0,y0,x1-x0,y1-y0,Math.min(20,rx*0.3,ry*0.3));ctx.stroke();break;
    case'triangle':ctx.moveTo(cx,y0);ctx.lineTo(x1,y1);ctx.lineTo(x0,y1);ctx.closePath();ctx.stroke();break;
    case'star':drawStar(ctx,cx,cy,r,r*0.45,5);ctx.stroke();break;
    case'heart':drawHeart(ctx,cx,cy,rx,ry);break;
    case'diamond':ctx.moveTo(cx,y0);ctx.lineTo(x1,cy);ctx.lineTo(cx,y1);ctx.lineTo(x0,cy);ctx.closePath();ctx.stroke();break;
    case'pentagon':drawPolygon(ctx,cx,cy,r,5,-Math.PI/2);ctx.stroke();break;
    case'hexagon':drawPolygon(ctx,cx,cy,r,6,0);ctx.stroke();break;
    case'house':drawHouse(ctx,x0,y0,x1,y1);break;
    case'tree':drawTree(ctx,x0,y0,x1,y1);break;
    case'car':drawCar(ctx,x0,y0,x1,y1);break;
    case'fish':drawFish(ctx,cx,cy,rx,ry);break;
    case'butterfly':drawButterfly(ctx,cx,cy,rx,ry);break;
    case'flower2':drawFlower(ctx,cx,cy,r);break;
    case'sun':drawSun(ctx,cx,cy,r);break;
    case'cloud':drawCloud(ctx,cx,cy,rx,ry);ctx.stroke();break;
    case'lightning':drawLightning(ctx,cx,cy,rx,ry);ctx.stroke();break;
    case'moon':drawMoon(ctx,cx,cy,r);ctx.stroke();break;
    case'smiley':drawSmiley(ctx,cx,cy,r);break;
    case'cat':drawCat(ctx,cx,cy,rx,ry);break;
    case'rabbit':drawRabbit(ctx,cx,cy,rx,ry);break;
    case'apple':drawApple(ctx,cx,cy,rx,ry);break;
    case'star2':drawStar(ctx,cx,cy,r,r*0.5,5);ctx.stroke();break;
    case'arrow-r':ctx.moveTo(x0,cy);ctx.lineTo(x1,cy);ctx.moveTo(x1-rx*0.3,y0);ctx.lineTo(x1,cy);ctx.lineTo(x1-rx*0.3,y1);ctx.stroke();break;
    case'cross':ctx.moveTo(cx,y0);ctx.lineTo(cx,y1);ctx.moveTo(x0,cy);ctx.lineTo(x1,cy);ctx.stroke();break;
  }
}
function roundRect(ctx,x,y,w,h,r){ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function drawStar(ctx,cx,cy,ro,ri,n){for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,r=i%2===0?ro:ri;i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();}
function drawPolygon(ctx,cx,cy,r,n,off=0){for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();}
function drawHeart(ctx,cx,cy,rx,ry){const s=Math.min(rx,ry);ctx.moveTo(cx,cy+s*0.8);ctx.bezierCurveTo(cx-s*1.2,cy+s*0.2,cx-s*1.2,cy-s*0.8,cx,cy-s*0.2);ctx.bezierCurveTo(cx+s*1.2,cy-s*0.8,cx+s*1.2,cy+s*0.2,cx,cy+s*0.8);ctx.closePath();ctx.stroke();}
function drawSmiley(ctx,cx,cy,r){ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.15,r*0.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+r*0.3,cy-r*0.15,r*0.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx,cy+r*0.05,r*0.45,0.2,Math.PI-0.2);ctx.stroke();}
function drawCloud(ctx,cx,cy,rx,ry){const r=Math.min(rx,ry)*0.5;ctx.arc(cx,cy-r*0.3,r*1.1,Math.PI,0);ctx.arc(cx+r,cy,r*0.8,Math.PI*1.5,Math.PI*0.5);ctx.arc(cx,cy+r*0.3,r*0.7,0,Math.PI);ctx.arc(cx-r,cy,r*0.8,Math.PI*0.5,Math.PI*1.5);ctx.closePath();}
function drawLightning(ctx,cx,cy,rx,ry){ctx.moveTo(cx+rx*0.1,cy-ry);ctx.lineTo(cx-rx*0.3,cy+ry*0.1);ctx.lineTo(cx+rx*0.15,cy+ry*0.05);ctx.lineTo(cx-rx*0.1,cy+ry);ctx.lineTo(cx+rx*0.3,cy-ry*0.05);ctx.lineTo(cx-rx*0.15,cy-ry*0.05);ctx.closePath();}
function drawMoon(ctx,cx,cy,r){ctx.arc(cx,cy,r,0.4,Math.PI*2-0.4);ctx.arc(cx+r*0.4,cy,r*0.75,Math.PI*2-0.4+Math.PI,0.4+Math.PI,true);ctx.closePath();}
function drawSun(ctx,cx,cy,r){ctx.arc(cx,cy,r*0.5,0,Math.PI*2);ctx.stroke();const rays=8;for(let i=0;i<rays;i++){const a=i*Math.PI*2/rays;ctx.beginPath();ctx.moveTo(cx+r*0.6*Math.cos(a),cy+r*0.6*Math.sin(a));ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.stroke();}}
function drawFlower(ctx,cx,cy,r){for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.save();ctx.translate(cx+r*0.45*Math.cos(a),cy+r*0.45*Math.sin(a));ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,0,r*0.28,r*0.48,0,0,Math.PI*2);ctx.stroke();ctx.restore();}ctx.beginPath();ctx.arc(cx,cy,r*0.22,0,Math.PI*2);ctx.stroke();}
function drawHouse(ctx,x0,y0,x1,y1){const w=x1-x0,h=y1-y0,cx=(x0+x1)/2,roofH=h*0.4,wallH=h*0.6,doorW=w*0.22,doorH=wallH*0.45;ctx.moveTo(x0,y0+roofH);ctx.lineTo(cx,y0);ctx.lineTo(x1,y0+roofH);ctx.lineTo(x1,y1);ctx.lineTo(x0,y1);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.rect(cx-doorW/2,y1-doorH,doorW,doorH);ctx.stroke();ctx.beginPath();ctx.rect(x0+w*0.12,y0+roofH+h*0.08,w*0.2,h*0.18);ctx.stroke();}
function drawTree(ctx,x0,y0,x1,y1){const w=x1-x0,h=y1-y0,cx=(x0+x1)/2,trunkW=w*0.14,trunkH=h*0.3;ctx.moveTo(cx-w*0.5,y1);ctx.lineTo(cx+w*0.5,y1);ctx.moveTo(cx-trunkW/2,y1);ctx.lineTo(cx-trunkW/2,y1-trunkH);ctx.lineTo(cx+trunkW/2,y1-trunkH);ctx.lineTo(cx+trunkW/2,y1);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,y0);ctx.lineTo(x1,y0+h*0.45);ctx.lineTo(cx+w*0.25,y0+h*0.45);ctx.lineTo(x1-w*0.07,y0+h*0.65);ctx.lineTo(cx+w*0.15,y0+h*0.65);ctx.lineTo(cx+w*0.35,y1-trunkH);ctx.lineTo(cx-w*0.35,y1-trunkH);ctx.lineTo(cx-w*0.15,y0+h*0.65);ctx.lineTo(x0+w*0.07,y0+h*0.65);ctx.lineTo(cx-w*0.25,y0+h*0.45);ctx.lineTo(x0,y0+h*0.45);ctx.closePath();ctx.stroke();}
function drawCar(ctx,x0,y0,x1,y1){const w=x1-x0,h=y1-y0,bodyY=y0+h*0.35,wheelR=h*0.22;ctx.rect(x0+w*0.05,bodyY,w*0.9,h*0.42);ctx.stroke();ctx.beginPath();ctx.moveTo(x0+w*0.18,bodyY);ctx.lineTo(x0+w*0.28,y0+h*0.1);ctx.lineTo(x0+w*0.72,y0+h*0.1);ctx.lineTo(x0+w*0.82,bodyY);ctx.stroke();ctx.beginPath();ctx.arc(x0+w*0.25,y1-wheelR*0.9,wheelR,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x0+w*0.75,y1-wheelR*0.9,wheelR,0,Math.PI*2);ctx.stroke();}
function drawFish(ctx,cx,cy,rx,ry){ctx.ellipse(cx-rx*0.12,cy,rx*0.75,ry*0.7,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+rx*0.55,cy-ry*0.7);ctx.lineTo(cx+rx,cy);ctx.lineTo(cx+rx*0.55,cy+ry*0.7);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(cx-rx*0.35,cy-ry*0.22,ry*0.1,0,Math.PI*2);ctx.fill();}
function drawButterfly(ctx,cx,cy,rx,ry){ctx.moveTo(cx,cy);ctx.bezierCurveTo(cx-rx*0.3,cy-ry*0.8,cx-rx,cy-ry,cx-rx*0.8,cy+ry*0.2);ctx.bezierCurveTo(cx-rx*0.5,cy+ry*0.6,cx-rx*0.1,cy+ry*0.1,cx,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy);ctx.bezierCurveTo(cx+rx*0.3,cy-ry*0.8,cx+rx,cy-ry,cx+rx*0.8,cy+ry*0.2);ctx.bezierCurveTo(cx+rx*0.5,cy+ry*0.6,cx+rx*0.1,cy+ry*0.1,cx,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy-ry*0.6);ctx.lineTo(cx,cy+ry*0.6);ctx.stroke();}
function drawCat(ctx,cx,cy,rx,ry){ctx.ellipse(cx,cy+ry*0.2,rx*0.85,ry*0.75,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-rx*0.55,cy-ry*0.1);ctx.lineTo(cx-rx*0.7,cy-ry);ctx.lineTo(cx-rx*0.25,cy-ry*0.3);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(cx+rx*0.55,cy-ry*0.1);ctx.lineTo(cx+rx*0.7,cy-ry);ctx.lineTo(cx+rx*0.25,cy-ry*0.3);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(cx-rx*0.3,cy+ry*0.05,ry*0.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+rx*0.3,cy+ry*0.05,ry*0.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx,cy+ry*0.25,ry*0.09,0,Math.PI*2);ctx.fill();}
function drawRabbit(ctx,cx,cy,rx,ry){ctx.ellipse(cx,cy+ry*0.25,rx*0.75,ry*0.7,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(cx-rx*0.3,cy-ry*0.2,rx*0.22,ry*0.55,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(cx+rx*0.3,cy-ry*0.2,rx*0.22,ry*0.55,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx-rx*0.22,cy+ry*0.15,ry*0.09,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+rx*0.22,cy+ry*0.15,ry*0.09,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx,cy+ry*0.35,ry*0.07,0,Math.PI*2);ctx.fill();}
function drawApple(ctx,cx,cy,rx,ry){ctx.moveTo(cx,cy-ry*0.5);ctx.bezierCurveTo(cx+rx*0.2,cy-ry*0.95,cx+rx*0.6,cy-ry*0.55,cx+rx*0.5,cy-ry*0.1);ctx.bezierCurveTo(cx+rx,cy+ry*0.4,cx+rx*0.7,cy+ry,cx,cy+ry);ctx.bezierCurveTo(cx-rx*0.7,cy+ry,cx-rx,cy+ry*0.4,cx-rx*0.5,cy-ry*0.1);ctx.bezierCurveTo(cx-rx*0.6,cy-ry*0.55,cx-rx*0.2,cy-ry*0.95,cx,cy-ry*0.5);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(cx+rx*0.1,cy-ry*0.8);ctx.quadraticCurveTo(cx+rx*0.5,cy-ry*1.3,cx+rx*0.3,cy-ry*0.95);ctx.stroke();}

// GLITTER TOOL
// ══════════════════════════════════════════════════
const GCOL={'glitter-gold':()=>`hsl(${40+Math.random()*20},100%,${50+Math.random()*30}%)`,'glitter-silver':()=>`hsl(0,0%,${60+Math.random()*38}%)`,'glitter-rainbow':()=>`hsl(${Math.random()*360},100%,${55+Math.random()*20}%)`};
function spawnGlitter(x,y,type){wctx.save();wctx.globalCompositeOperation='source-over';for(let i=0;i<14;i++){const px=x+(Math.random()-.5)*22,py=y+(Math.random()-.5)*22;wctx.fillStyle=GCOL[type]();wctx.shadowColor=wctx.fillStyle;wctx.shadowBlur=4;wctx.beginPath();wctx.arc(px,py,1+Math.random()*2.5,0,Math.PI*2);wctx.fill();S.gp.push({x:px,y:py,vx:(Math.random()-.5)*2.5,vy:(Math.random()-.5)*2-1,sz:2+Math.random()*3.5,col:GCOL[type](),life:1,dc:0.035+Math.random()*0.04});}wctx.restore();animGlitter();}
let graf=0;
function animGlitter(){cancelAnimationFrame(graf);graf=requestAnimationFrame(()=>{gctx.clearRect(0,0,gc.width,gc.height);S.gp=S.gp.filter(p=>p.life>0);S.gp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=p.dc;gctx.save();gctx.globalAlpha=Math.max(0,p.life);gctx.fillStyle=p.col;gctx.shadowColor=p.col;gctx.shadowBlur=6;gctx.beginPath();gctx.arc(p.x,p.y,p.sz,0,Math.PI*2);gctx.fill();gctx.restore();});if(S.gp.length)animGlitter();else gctx.clearRect(0,0,gc.width,gc.height);});}

// MOVABLE OBJECTS SYSTEM
// ══════════════════════════════════════════════════
let objIdCounter=0;
function addObject(type,content,x,y,w,h){
  const id='obj'+(++objIdCounter);
  OBJECTS.push({id,type,content,x,y,w,h,rot:0});
  renderObjects();
  selectObj(id);
  return id;
}
function renderObjects(){
  objLayer.innerHTML='';
  OBJECTS.forEach(obj=>objLayer.appendChild(createObjEl(obj)));
}
function createObjEl(obj){
  const el=document.createElement('div');
  el.className='mob'+(selectedObjId===obj.id?' selected':'');
  el.id=obj.id;
  el.style.cssText=`left:${obj.x}px;top:${obj.y}px;width:${obj.w}px;height:${obj.h}px;transform:rotate(${obj.rot}deg);position:absolute;cursor:grab;touch-action:none;transform-origin:center center;`;
  // content
  const inner=document.createElement('div');
  inner.className='mob-inner';
  inner.style.cssText=`width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;`;
  if(obj.type==='emoji'||obj.type==='sticker'){
    inner.style.fontSize=Math.min(obj.w,obj.h)*0.72+'px';
    inner.textContent=obj.content;
  } else if(obj.type==='text'){
    const span=document.createElement('span');
    span.style.cssText=`font-family:${obj.fontCss};color:${obj.color};font-size:${obj.fontSize}px;font-weight:${obj.bold?'900':'400'};text-decoration:${obj.under?'underline':'none'};font-style:${obj.italic?'italic':'normal'};white-space:nowrap;pointer-events:none;`;
    span.textContent=obj.content;
    inner.appendChild(span);
  }
  el.appendChild(inner);
  // delete btn
  const del=document.createElement('div');del.className='mob-del';del.textContent='✕';
  del.addEventListener('pointerdown',e=>{e.stopPropagation();removeObj(obj.id);},{passive:false});
  el.appendChild(del);
  // resize handle (bottom-right)
  const rh=document.createElement('div');rh.className='mob-handle';rh.style.cssText='bottom:-11px;right:-11px;';rh.textContent='⇲';
  setupResize(rh,obj);
  el.appendChild(rh);
  // rotate handle (top-right)
  const roth=document.createElement('div');roth.className='mob-handle rot';roth.style.cssText='top:-11px;right:-11px;';roth.textContent='↻';
  setupRotate(roth,obj);
  el.appendChild(roth);
  // drag
  setupDrag(el,obj);
  return el;
}
function setupDrag(el,obj){
  let startX,startY,ox,oy;
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('mob-handle')||e.target.classList.contains('mob-del'))return;
    e.stopPropagation();e.preventDefault();
    selectObj(obj.id);
    startX=e.clientX;startY=e.clientY;ox=obj.x;oy=obj.y;
    el.setPointerCapture(e.pointerId);
  },{passive:false});
  el.addEventListener('pointermove',e=>{
    if(!el.hasPointerCapture(e.pointerId))return;
    if(e.target.classList.contains('mob-handle')||e.target.classList.contains('mob-del'))return;
    e.preventDefault();
    const dx=(e.clientX-startX)/S.zoom,dy=(e.clientY-startY)/S.zoom;
    obj.x=ox+dx;obj.y=oy+dy;
    el.style.left=obj.x+'px';el.style.top=obj.y+'px';
  },{passive:false});
}
function setupResize(handle,obj){
  let startX,startY,ow,oh;
  handle.addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    startX=e.clientX;startY=e.clientY;ow=obj.w;oh=obj.h;
    handle.setPointerCapture(e.pointerId);
  },{passive:false});
  handle.addEventListener('pointermove',e=>{
    if(!handle.hasPointerCapture(e.pointerId))return;
    e.preventDefault();
    const dx=(e.clientX-startX)/S.zoom,dy=(e.clientY-startY)/S.zoom;
    obj.w=Math.max(40,ow+dx);obj.h=Math.max(40,oh+dy);
    const el=document.getElementById(obj.id);
    if(el){el.style.width=obj.w+'px';el.style.height=obj.h+'px';
      const inner=el.querySelector('.mob-inner');
      if(obj.type!=='text'&&inner)inner.style.fontSize=Math.min(obj.w,obj.h)*0.72+'px';
    }
  },{passive:false});
}
function setupRotate(handle,obj){
  let el;
  handle.addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    el=document.getElementById(obj.id);
    handle.setPointerCapture(e.pointerId);
  },{passive:false});
  handle.addEventListener('pointermove',e=>{
    if(!handle.hasPointerCapture(e.pointerId)||!el)return;
    e.preventDefault();
    const rect=el.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    obj.rot=Math.round(Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI)+90;
    el.style.transform=`rotate(${obj.rot}deg)`;
  },{passive:false});
}
function selectObj(id){
  selectedObjId=id;
  document.querySelectorAll('.mob').forEach(el=>el.classList.toggle('selected',el.id===id));
}
function deselectObj(){selectedObjId=null;document.querySelectorAll('.mob').forEach(el=>el.classList.remove('selected'));}
function removeObj(id){OBJECTS=OBJECTS.filter(o=>o.id!==id);if(selectedObjId===id)selectedObjId=null;renderObjects();}
function flattenObjects(){
  if(!OBJECTS.length){showToast('No objects to flatten!');return;}
  OBJECTS.forEach(obj=>{
    wctx.save();
    const cx=obj.x+obj.w/2,cy=obj.y+obj.h/2;
    wctx.translate(cx,cy);wctx.rotate(obj.rot*Math.PI/180);wctx.translate(-obj.w/2,-obj.h/2);
    if(obj.type==='emoji'||obj.type==='sticker'){
      wctx.font=`${Math.min(obj.w,obj.h)*0.72}px serif`;
      wctx.textAlign='center';wctx.textBaseline='middle';
      wctx.fillText(obj.content,obj.w/2,obj.h/2);
    } else if(obj.type==='text'){
      wctx.font=`${obj.italic?'italic ':''} ${obj.bold?'900':'400'} ${obj.fontSize}px ${obj.fontCss}`;
      wctx.fillStyle=obj.color;wctx.globalAlpha=1;
      wctx.textAlign='center';wctx.textBaseline='middle';
      if(obj.under){wctx.save();const m=wctx.measureText(obj.content);wctx.fillRect(obj.w/2-m.width/2,obj.h/2+obj.fontSize*0.12,m.width,2);wctx.restore();}
      wctx.fillText(obj.content,obj.w/2,obj.h/2);
    }
    wctx.restore();
  });
  OBJECTS=[];renderObjects();
  redraw();pushHist();
  showToast('Objects merged to canvas! ⬇️');
}

// ══════════════════════════════════════════════════
// STICKERS & EMOJIS
// ══════════════════════════════════════════════════
function buildItemPanel(panelId,catsId,gridId,data,stateKey,onSelect){
  const catsEl=document.getElementById(catsId);
  let currentCat=Object.keys(data)[0];
  Object.keys(data).forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(cat===currentCat?' on':'');
    btn.textContent=cat;
    btn.addEventListener('pointerdown',e=>{e.stopPropagation();currentCat=cat;document.querySelectorAll('#'+catsId+' .tab-btn').forEach(b=>b.classList.toggle('on',b.textContent===cat));renderGrid();},{passive:false});
    catsEl.appendChild(btn);
  });
  function renderGrid(){
    const gridEl=document.getElementById(gridId);gridEl.innerHTML='';
    data[currentCat].forEach(item=>{
      const btn=document.createElement('button');
      const cls=stateKey==='selectedSticker'?'stk':'emj';
      btn.className=cls+(S[stateKey]===item?' on':'');
      btn.textContent=item;
      btn.addEventListener('pointerdown',e=>{e.stopPropagation();S[stateKey]=item;document.querySelectorAll('#'+gridId+' .'+cls).forEach(b=>b.classList.toggle('on',b.textContent===item));onSelect(item);},{passive:false});
      gridEl.appendChild(btn);
    });
  }
  renderGrid();
}
buildItemPanel('sticker-panel','sticker-cats','sticker-grid',STICKERS,'selectedSticker',item=>{
  closeAllPopups();setTool('sticker');S.selectedSticker=item;showToast('Tap canvas to place '+item);playSticker();
});
buildItemPanel('emoji-panel','emoji-cats','emoji-grid',EMOJIS,'selectedEmoji',item=>{
  closeAllPopups();setTool('emoji');S.selectedEmoji=item;showToast('Tap canvas to place '+item);playSticker();
});
document.getElementById('sticker-close').addEventListener('pointerdown',e=>{e.stopPropagation();closeAllPopups();},{passive:false});

// ══════════════════════════════════════════════════

// ══════════════════════════════════════════════════
// BACKGROUND
// ══════════════════════════════════════════════════
(function buildBgGrid(){

document.getElementById('bbg').addEventListener('pointerdown',e=>{e.stopPropagation();if(!S.canvasW){showToast('Open or create a page first!');return;}openPopup('bg-panel');},{passive:false});

// ══════════════════════════════════════════════════
// POPUP MANAGEMENT
// ══════════════════════════════════════════════════
function openPopup(id){closeAllPopups();document.getElementById(id).classList.add('open');document.getElementById('backdrop').classList.add('show');}
function closeAllPopups(){document.querySelectorAll('.popup-panel').forEach(p=>p.classList.remove('open'));document.getElementById('backdrop').classList.remove('show');}

// ══════════════════════════════════════════════════
// HISTORY
// ══════════════════════════════════════════════════
function pushHist(){if(!wc.width)return;S.hist=S.hist.slice(0,S.hi+1);const snap=wctx.getImageData(0,0,wc.width,wc.height);S.hist.push(snap);if(S.hist.length>MAX_HIST)S.hist.shift();S.hi=S.hist.length-1;updateHbtns();}
function undo(){if(S.hi<=0)return;S.hi--;wctx.putImageData(S.hist[S.hi],0,0);redraw();updateHbtns();showToast('Undo ↩️');}
function redo(){if(S.hi>=S.hist.length-1)return;S.hi++;wctx.putImageData(S.hist[S.hi],0,0);redraw();updateHbtns();showToast('Redo ↪️');}
function updateHbtns(){document.getElementById('bundo').classList.toggle('off',S.hi<=0);document.getElementById('bredo').classList.toggle('off',S.hi>=S.hist.length-1);}
document.getElementById('bundo').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();undo();},{passive:false});
document.getElementById('bredo').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();redo();},{passive:false});

// ══════════════════════════════════════════════════
// CLEAR & NEW IMAGE
// ══════════════════════════════════════════════════
document.getElementById('bclear').addEventListener('pointerdown',e=>{
  e.stopPropagation();if(!S.canvasW){showToast('Nothing to clear!');return;}
  wctx.fillStyle=S.bgColor||'#ffffff';wctx.fillRect(0,0,wc.width,wc.height);
  if(S.origImg)wctx.drawImage(S.origImg,0,0,wc.width,wc.height);
  OBJECTS=[];renderObjects();redraw();pushHist();showToast('Canvas cleared! 🗑️');
},{passive:false});
document.getElementById('bnewimg').addEventListener('pointerdown',e=>{
  e.stopPropagation();S.origImg=null;S.isBlankMode=false;S.hist=[];S.hi=-1;S.canvasW=0;S.canvasH=0;
  dctx.clearRect(0,0,dc.width,dc.height);gctx.clearRect(0,0,gc.width,gc.height);
  OBJECTS=[];objLayer.innerHTML='';
  uscreen.classList.remove('gone');updateHbtns();showToast('Ready for new image 🔄');
},{passive:false});

// ══════════════════════════════════════════════════
// POINTER EVENTS
// ══════════════════════════════════════════════════
cwrap.addEventListener('pointerdown',onDown,{passive:false});
cwrap.addEventListener('pointermove',onMove,{passive:false});
cwrap.addEventListener('pointerup',onUp,{passive:false});
cwrap.addEventListener('pointercancel',onUp,{passive:false});

function onDown(e){
  e.preventDefault();
  // If click hits an object element, don't interfere
  if(e.target.closest('.mob'))return;
  if(S.tool==='select'){deselectObj();return;}
  S.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  const n=Object.keys(S.ptrs).length;
  if(n===1&&S.canvasW){
    const pt=p2c(e.clientX,e.clientY);toolDown(pt,e);
  } else if(n===2){
    if(S.painting)commitPaint();
    const pts=Object.values(S.ptrs);
    S.lastDist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    S.lastMid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
  }
}
function onMove(e){
  e.preventDefault();
  S.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  const n=Object.keys(S.ptrs).length;
  moveBcur(e);
  if(n===1&&S.painting&&S.canvasW){toolMove(p2c(e.clientX,e.clientY));}
  else if(n===2){
    const pts=Object.values(S.ptrs);
    const dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
    if(S.lastDist)S.zoom=Math.max(0.2,Math.min(12,S.zoom*dist/S.lastDist));
    if(S.lastMid){S.tx+=mid.x-S.lastMid.x;S.ty+=mid.y-S.lastMid.y;}
    S.lastDist=dist;S.lastMid=mid;applyXform();
  }
}
function onUp(e){
  e.preventDefault();
  delete S.ptrs[e.pointerId];
  const n=Object.keys(S.ptrs).length;
  if(n<2){S.lastDist=0;S.lastMid=null;}
  if(n===0&&S.painting)commitPaint();
  if(n===0&&S.tool==='shape'&&shapeStart){
    const pt=p2c(e.clientX,e.clientY);
    commitShape(shapeStart.x,shapeStart.y,pt.x,pt.y);
    shapeStart=null;S.painting=false;
  }
}
function toolDown(pt,e){
  const t=S.tool;
  playSound(t);
  if(t==='fill'){
    if(!inB(pt.x,pt.y))return;
    floodFill(pt.x,pt.y);redraw();pushHist();
  } else if(t==='sticker'){
    if(!inB(pt.x,pt.y))return;
    const sz=Math.max(60,Math.min(S.canvasW,S.canvasH)*0.1);
    addObject('sticker',S.selectedSticker||'🧸',pt.x-sz/2,pt.y-sz/2,sz,sz);
  } else if(t==='emoji'){
    if(!inB(pt.x,pt.y))return;
    const sz=Math.max(60,Math.min(S.canvasW,S.canvasH)*0.1);
    addObject('emoji',S.selectedEmoji||'😊',pt.x-sz/2,pt.y-sz/2,sz,sz);
  } else if(t==='text'){
    if(!inB(pt.x,pt.y))return;
    if(!S._pendingText){openPopup('text-panel');return;}
    const txt=S._pendingText;S._pendingText=null;
    const fs=S.textSize||48;
    const estW=Math.max(100,txt.length*fs*0.6);
    addObject('text',txt,pt.x-estW/2,pt.y-fs/2,estW,fs*1.5,{fontCss:S.textFont,color:S.textColor,fontSize:fs,bold:S.textBold,under:S.textUnder,italic:S.textItalic});
  } else if(t==='shape'){
    shapeStart=pt;S.painting=true;
  } else {
    S.painting=true;S.lastPt=pt;
    applyBrush(pt.x,pt.y,pt.x,pt.y);redraw();
  }
}
// Override addObject to support extra props for text
const _addObj=addObject;
window.addObject=function(type,content,x,y,w,h,extra={}){
  const id='obj'+(++objIdCounter);
  const obj={id,type,content,x,y,w,h,rot:0,...extra};
  OBJECTS.push(obj);renderObjects();selectObj(id);return id;
};
function toolMove(pt){
  if(!S.painting)return;
  const t=S.tool;
  if(t==='shape'&&shapeStart){drawShapePreview(shapeStart.x,shapeStart.y,pt.x,pt.y);return;}
  applyBrush(S.lastPt.x,S.lastPt.y,pt.x,pt.y);
  S.lastPt=pt;redraw();
}
function commitPaint(){if(S.tool==='shape')return;S.painting=false;S.lastPt=null;pushHist();}
function applyBrush(x0,y0,x1,y1){
  const t=S.tool;
  if(t==='eraser')strokeLine(x0,y0,x1,y1,S.penSize,null,true);
  else if(t==='pencil')pencilLine(x0,y0,x1,y1);
  else if(BSIZES[t])strokeLine(x0,y0,x1,y1,BSIZES[t]/2,S.color,false);
  else if(t.startsWith('glitter'))if(Math.hypot(x1-x0,y1-y0)>3||x0===x1)spawnGlitter(x1,y1,t);
}

// double-tap zoom
let lastTap=0;
cwrap.addEventListener('touchend',e=>{
  if(e.touches.length>0)return;
  const now=Date.now();
  if(now-lastTap<280){S.zoom>1.5?fitScreen():(S.zoom=2.5,applyXform());}
  lastTap=now;
},{passive:true});

// ══════════════════════════════════════════════════
// BRUSH CURSOR
// ══════════════════════════════════════════════════
function moveBcur(e){
  const t=S.tool;let r=0;
  if(t==='eraser'||t==='pencil')r=S.penSize/2;
  else if(BSIZES[t])r=BSIZES[t]/2;
  else if(t.startsWith('glitter'))r=14;
  if(!r){bcur.style.display='none';return;}
  const sz=Math.max(8,r*2*S.zoom);
  bcur.style.cssText=`display:block;width:${sz}px;height:${sz}px;left:${e.clientX}px;top:${e.clientY}px;border:2px solid ${t==='eraser'?'rgba(255,255,255,.8)':S.color};background:${t==='eraser'?'rgba(255,255,255,.1)':S.color+'33'};border-radius:50%;position:fixed;pointer-events:none;transform:translate(-50%,-50%);z-index:50;`;
}
cwrap.addEventListener('pointerleave',()=>bcur.style.display='none');

// ══════════════════════════════════════════════════
// ZOOM
// ══════════════════════════════════════════════════
document.getElementById('bzin').addEventListener('pointerdown',e=>{e.stopPropagation();S.zoom=Math.min(12,S.zoom*1.4);applyXform();},{passive:false});
document.getElementById('bzout').addEventListener('pointerdown',e=>{e.stopPropagation();S.zoom=Math.max(0.2,S.zoom/1.4);applyXform();},{passive:false});
document.getElementById('bfit').addEventListener('pointerdown',e=>{e.stopPropagation();fitScreen();},{passive:false});
document.getElementById('bfit2').addEventListener('pointerdown',e=>{e.stopPropagation();fitScreen();},{passive:false});
function fitScreen(){S.zoom=1;S.tx=0;S.ty=0;applyXform();}

// ══════════════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════════════
document.getElementById('bsave').addEventListener('pointerdown',e=>{
  e.stopPropagation();
  if(!S.canvasW){showToast('Nothing to save!');return;}
  spin.classList.remove('gone');
  setTimeout(()=>{
    // Flatten objects before save
    const tempObjs=[...OBJECTS];
    flattenObjects();
    const ex=document.createElement('canvas');
    const ew=S.origW||S.canvasW,eh=S.origH||S.canvasH;
    ex.width=ew;ex.height=eh;
    const ec=ex.getContext('2d');
    ec.fillStyle=S.bgColor||'#ffffff';ec.fillRect(0,0,ew,eh);
    if(S.origImg)ec.drawImage(S.origImg,0,0,ew,eh);
    ec.drawImage(wc,0,0,ew,eh);
    ex.toBlob(blob=>{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='rudra-'+Date.now()+'.png';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      spin.classList.add('gone');showToast('Saved! 🎉');
    },'image/png');
  },80);
},{passive:false});

// ══════════════════════════════════════════════════
// SOUND
// ══════════════════════════════════════════════════
let actx=null;
function getActx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function beep(freq,dur,vol=0.1,type='sine'){try{const a=getActx();const o=a.createOscillator();const g=a.createGain();o.type=type;o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(freq,a.currentTime);o.frequency.exponentialRampToValueAtTime(freq*0.5,a.currentTime+dur);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);o.start();o.stop(a.currentTime+dur);}catch(e){}}
function playSticker(){beep(600,0.12,0.1);setTimeout(()=>beep(900,0.1,0.08),80);}
function playSound(t){if(t==='fill')beep(400,0.12,0.08,'square');else if(t.startsWith('glitter')){beep(800+Math.random()*400,0.08,0.05);setTimeout(()=>beep(1000+Math.random()*400,0.07,0.04),40);}else if(t==='sticker'||t==='emoji'||t==='text')playSticker();}

// ══════════════════════════════════════════════════
// RESIZE
// ══════════════════════════════════════════════════
let rsTimer;
window.addEventListener('resize',()=>{
  clearTimeout(rsTimer);rsTimer=setTimeout(()=>{
    if(S.canvasW){const tmp=wctx.getImageData(0,0,wc.width,wc.height);const pw=wc.width,ph=wc.height;
      if(S.origImg)setupCanvas();
      const tc=document.createElement('canvas');tc.width=pw;tc.height=ph;tc.getContext('2d').putImageData(tmp,0,0);wctx.drawImage(tc,0,0,wc.width,wc.height);redraw();}
    applyXform();
  },200);
});

// ══════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),2500);}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
applyXform();updateHbtns();curColorRing.style.background=S.color;setTool('pencil');
updateTextPreview();
showToast('Welcome to Rudra v2! 🎨 Tap 📄 Blank to start!');
</script>
