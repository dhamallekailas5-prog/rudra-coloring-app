<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rudra Colors">
<meta name="theme-color" content="#1a1a2e">
<title>Rudra Coloring App</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12121f;--panel:#1e1e35;--panel2:#252540;
  --accent:#ff6b9d;--accent2:#c084fc;
  --text:#f0f0ff;--dim:#8888aa;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;}

/* ── APP SHELL ── */
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr;height:100dvh;height:100vh;}

/* ── HEADER ── */
#header{
  grid-row:1;grid-column:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));
  background:var(--panel);border-bottom:1px solid rgba(255,255,255,.07);
  gap:6px;z-index:30;flex-wrap:nowrap;overflow:hidden;
}
#logo{font-family:'Fredoka One',cursive;font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;flex-shrink:0;}

#upload-group{display:flex;gap:4px;align-items:center;flex-shrink:0;}
.upload-hbtn{
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  padding:5px 7px;min-width:48px;background:var(--panel2);
  border:none;border-radius:11px;cursor:pointer;
}
.upload-hbtn-icon{font-size:17px;line-height:1;}
.upload-hbtn-txt{font-size:8px;font-weight:800;color:var(--dim);letter-spacing:.3px;}
.upload-hbtn:active{opacity:.6;}

#header-right{display:flex;gap:4px;align-items:center;flex-shrink:0;}
.hbtn{
  background:var(--panel2);border:none;color:var(--text);border-radius:11px;
  padding:7px 8px;font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-family:'Nunito',sans-serif;font-weight:700;
  flex-shrink:0;-webkit-appearance:none;min-width:38px;min-height:38px;
}
.hbtn:active{opacity:.6;}
.hbtn.off{opacity:.28;pointer-events:none;}

/* current color dot in header */
#cur-color-ring{
  width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.5);
  flex-shrink:0;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s;
}
#cur-color-ring input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}

/* ── MIDDLE ROW: left panel + canvas + right panel ── */
#middle{
  grid-row:2;grid-column:1;
  display:flex;flex-direction:row;overflow:hidden;position:relative;
}

/* ── SIDE PANELS ── */
.side-panel{
  width:64px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;
  padding:8px 0;gap:5px;overflow-y:auto;overflow-x:hidden;
  flex-shrink:0;z-index:20;
  /* panels are FIXED in layout — not affected by canvas zoom */
}
#left-panel{border-right:1px solid rgba(255,255,255,.06);}
#right-panel{border-left:1px solid rgba(255,255,255,.06);}

.tbtn{
  width:50px;height:50px;border-radius:13px;background:var(--panel2);
  border:2px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  font-size:20px;gap:1px;flex-shrink:0;-webkit-appearance:none;
  transition:border-color .15s,background .15s;
}
.tbtn .lbl{font-size:8px;font-weight:800;color:var(--dim);letter-spacing:.3px;}
.tbtn:active{opacity:.55;}
.tbtn.on{background:linear-gradient(135deg,#2d2d5e,#3d2d6e);border-color:var(--accent2);}
.tbtn.on .lbl{color:var(--accent2);}
.sep{width:38px;height:1px;background:rgba(255,255,255,.08);margin:2px 0;flex-shrink:0;}

/* sensitivity */
#sens-box{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;background:var(--panel2);border-radius:11px;width:50px;}
#sens-box label{font-size:7.5px;font-weight:800;color:var(--dim);text-align:center;line-height:1.2;}
#sens{-webkit-appearance:none;width:34px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));outline:none;}
#sens::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);}

/* opacity */
#opacity-box{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;background:var(--panel2);border-radius:11px;width:50px;}
#opacity-box label{font-size:7.5px;font-weight:800;color:var(--dim);text-align:center;line-height:1.2;}
#opac{-webkit-appearance:none;width:34px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9));outline:none;}
#opac::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);}

/* ── CANVAS WRAP ── */
#cwrap{
  flex:1;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at center,#1e1e3a 0%,#0d0d1a 100%);
  /* IMPORTANT: touch events only on canvas wrap, not panels */
  touch-action:none;
}
/* Only the canvas elements get transformed, NOT the panels */
#canvas-container{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
#dc,#gc{
  display:block;position:absolute;
  border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.7);
  pointer-events:none;
  /* transform applied via JS only to these elements */
}
#wc{display:none;}

/* ── BOTTOM: color palette ── */
#bbar{
  grid-row:3;grid-column:1;
  background:var(--panel);border-top:1px solid rgba(255,255,255,.06);
  padding:7px 10px;padding-bottom:max(7px,env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:7px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;z-index:20;
}
#bbar::-webkit-scrollbar{display:none;}
.sw{
  width:38px;height:38px;border-radius:50%;border:3px solid transparent;
  cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4);
  transition:transform .1s,border-color .1s;
}
.sw:active{transform:scale(.82);}
.sw.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.5);}
#ccbtn{
  width:38px;height:38px;border-radius:50%;
  border:3px dashed rgba(255,255,255,.4);
  background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
  cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;
}
#ccbtn:active{opacity:.7;}
#ccbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}

/* ── EMPTY STATE ── */
#uscreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;pointer-events:none;}
#uscreen.gone{display:none;}
#uscreen-inner{text-align:center;padding:28px 32px;background:rgba(30,30,52,.75);border-radius:22px;border:2px dashed rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}

/* ── STICKER PANEL ── */
#sticker-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--panel);border-top:2px solid rgba(255,255,255,.1);
  border-radius:20px 20px 0 0;
  padding:12px 10px 20px;z-index:40;
  transform:translateY(100%);transition:transform .3s ease;
  max-height:55%;display:flex;flex-direction:column;gap:8px;
}
#sticker-panel.open{transform:translateY(0);}
#sticker-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
#sticker-header h3{font-family:'Fredoka One',cursive;font-size:18px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#sticker-close{background:var(--panel2);border:none;color:var(--text);border-radius:10px;padding:5px 10px;font-size:16px;cursor:pointer;}
#sticker-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
#sticker-cats::-webkit-scrollbar{display:none;}
.scat{background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--dim);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.scat.on{border-color:var(--accent2);color:var(--accent2);}
#sticker-grid{display:flex;flex-wrap:wrap;gap:8px;overflow-y:auto;padding:4px 2px;justify-content:flex-start;}
.stk{
  width:52px;height:52px;border-radius:12px;background:var(--panel2);
  border:2px solid transparent;display:flex;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .1s;
}
.stk:active{transform:scale(.85);}
.stk.on{border-color:var(--accent);transform:scale(1.1);}

/* ── BG COLOR PICKER ── */
#bg-picker{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--panel);border-radius:20px;padding:20px;z-index:50;
  display:none;flex-direction:column;gap:12px;align-items:center;
  box-shadow:0 8px 40px rgba(0,0,0,.8);min-width:280px;
}
#bg-picker.open{display:flex;}
#bg-picker h3{font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);}
#bg-colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:260px;}
.bgc{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s;}
.bgc:active{transform:scale(.85);}
.bgc.on{border-color:#fff;}
#bg-close{background:var(--accent);border:none;color:#fff;border-radius:12px;padding:8px 24px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}

/* ── OVERLAY BACKDROP ── */
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none;}
#backdrop.show{display:block;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);
  background:rgba(20,20,50,.96);color:#fff;padding:9px 18px;
  border-radius:20px;font-weight:700;font-size:13px;
  opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;z-index:99;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SPINNER ── */
#spin{position:fixed;inset:0;background:rgba(10,10,20,.88);display:flex;align-items:center;justify-content:center;z-index:200;}
#spin.gone{display:none;}
.ring{width:48px;height:48px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

/* ── BRUSH CURSOR ── */
#bcur{position:fixed;pointer-events:none;border-radius:50%;z-index:50;display:none;transform:translate(-50%,-50%);transition:width .1s,height .1s;}
</style>
</head>
<body>
<div id="app">

<!-- ══ HEADER ══ -->
<div id="header">
  <div id="logo">🎨 Rudra</div>

  <div id="upload-group">
    <label class="upload-hbtn" title="Photos">
      <span class="upload-hbtn-icon">🖼️</span>
      <span class="upload-hbtn-txt">Photos</span>
      <input type="file" id="hfile-photos" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
    </label>
    <label class="upload-hbtn" title="Files">
      <span class="upload-hbtn-icon">📁</span>
      <span class="upload-hbtn-txt">Files</span>
      <input type="file" id="hfile-files" accept="image/png,image/jpeg,image/jpg,.png,.jpg,.jpeg" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
    </label>
    <label class="upload-hbtn" title="Camera">
      <span class="upload-hbtn-icon">📷</span>
      <span class="upload-hbtn-txt">Camera</span>
      <input type="file" id="hfile-camera" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
    </label>
  </div>

  <div id="header-right">
    <!-- current color indicator -->
    <div id="cur-color-ring" title="Pick custom color">
      <input type="color" id="ccin" value="#e74c3c">
    </div>
    <button class="hbtn off" id="bundo" title="Undo">↩️</button>
    <button class="hbtn off" id="bredo" title="Redo">↪️</button>
    <button class="hbtn" id="bfit" title="Fit to screen">⛶</button>
    <button class="hbtn" id="bsave" title="Save">💾</button>
    <button class="hbtn" id="bclear" title="Clear canvas">🗑️</button>
    <button class="hbtn" id="bnewimg" title="New image">🔄</button>
  </div>
</div>

<!-- ══ MIDDLE ══ -->
<div id="middle">

  <!-- LEFT TOOLS -->
  <div class="side-panel" id="left-panel">
    <button class="tbtn on" data-tool="fill">🪣<span class="lbl">FILL</span></button>
    <button class="tbtn" data-tool="brush-sm">🖌<span class="lbl">SML</span></button>
    <button class="tbtn" data-tool="brush-md">🖌<span class="lbl">MED</span></button>
    <button class="tbtn" data-tool="brush-lg">🖌<span class="lbl">LRG</span></button>
    <div class="sep"></div>
    <button class="tbtn" data-tool="glitter-gold">✨<span class="lbl">GOLD</span></button>
    <button class="tbtn" data-tool="glitter-silver">⭐<span class="lbl">SLVR</span></button>
    <button class="tbtn" data-tool="glitter-rainbow">🌈<span class="lbl">BOW</span></button>
    <div class="sep"></div>
    <button class="tbtn" data-tool="sticker" id="btn-sticker">🧸<span class="lbl">STCKR</span></button>
    <button class="tbtn" data-tool="eraser">🧹<span class="lbl">ERASE</span></button>
  </div>

  <!-- CANVAS -->
  <div id="cwrap">
    <div id="canvas-container">
      <canvas id="dc"></canvas>
      <canvas id="gc"></canvas>
    </div>
    <canvas id="wc"></canvas>

    <!-- empty state -->
    <div id="uscreen">
      <div id="uscreen-inner">
        <div style="font-size:56px;margin-bottom:10px;">🖼️</div>
        <div style="font-family:'Fredoka One',cursive;font-size:22px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;">Open a coloring page</div>
        <div style="color:var(--dim);font-size:13px;font-weight:600;">Use Photos · Files · Camera above</div>
      </div>
    </div>

    <!-- sticker panel -->
    <div id="sticker-panel">
      <div id="sticker-header">
        <h3>🧸 Choose a Sticker</h3>
        <button id="sticker-close">✕</button>
      </div>
      <div id="sticker-cats"></div>
      <div id="sticker-grid"></div>
    </div>

    <!-- bg color picker -->
    <div id="bg-picker">
      <h3>🎨 Background Color</h3>
      <div id="bg-colors"></div>
      <button id="bg-close">Done</button>
    </div>

    <div id="backdrop"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="side-panel" id="right-panel">
    <div id="sens-box">
      <label for="sens">FILL<br>SENSE</label>
      <input type="range" id="sens" min="1" max="100" value="32">
    </div>
    <div class="sep"></div>
    <div id="opacity-box">
      <label for="opac">BRUSH<br>OPAC</label>
      <input type="range" id="opac" min="5" max="100" value="100">
    </div>
    <div class="sep"></div>
    <button class="tbtn" id="bzin">🔍<span class="lbl">IN</span></button>
    <button class="tbtn" id="bzout">🔎<span class="lbl">OUT</span></button>
    <button class="tbtn" id="bfit2">⛶<span class="lbl">FIT</span></button>
    <div class="sep"></div>
    <button class="tbtn" id="bbg">🎨<span class="lbl">BG</span></button>
  </div>

</div>

<!-- ══ BOTTOM PALETTE ══ -->
<div id="bbar">
  <div id="ccbtn" title="Custom color">
    <input type="color" id="ccin2" value="#e74c3c">
  </div>
</div>

</div><!-- end #app -->

<!-- Spinner -->
<div id="spin" class="gone"><div class="ring"></div></div>
<!-- Toast -->
<div id="toast"></div>
<!-- Brush cursor -->
<div id="bcur"></div>

<script>
// ═══════════════════════════════════════════════════════
// STICKERS DATA
// ═══════════════════════════════════════════════════════
const STICKERS = {

};

// ═══════════════════════════════════════════════════════
// PALETTE
// ═══════════════════════════════════════════════════════
const PALETTE=[
  '#ffffff','#f8f9fa','#dee2e6','#adb5bd','#6c757d','#343a40','#111111',
  '#e74c3c','#c0392b','#e91e63','#ad1457','#9c27b0','#6a1b9a',
  '#673ab7','#4527a0','#3f51b5','#283593','#2196f3','#1565c0',

  '#ff5722','#795548','#4e342e','#607d8b','#37474f',

  '#f0abfc','#a5f3fc','#bbf7d0','#fed7aa','#fecdd3',

const BG_COLORS=[
  '#ffffff','#fff9f0','#f0f9ff','#f0fff4','#fff0f9',
  '#fef3c7','#e0e7ff','#fce7f3','#f5f3ff','#ecfdf5',
  '#111111','#1a1a2e','#0d1117','#1e3a2f','#1a0033',
];

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const MAX_HIST=50;
const DMAX=1800;

  tool:'fill',color:'#e74c3c',sensitivity:32,opacity:1,

  // canvas pan/zoom — only applied to dc and gc, NOT panels
  zoom:1,tx:0,ty:0,
  hist:[],hi:-1,
  ptrs:{},lastDist:0,lastMid:null,
  painting:false,lastPt:null,

  selectedSticker:null,
  bgColor:'#ffffff',

['hfile-photos','hfile-files','hfile-camera'].forEach(id=>{
  document.getElementById(id).addEventListener('change',function(){
    if(this.files&&this.files[0])loadFile(this.files[0]);
    this.value='';
  });
});

function loadFile(file){
  spin.classList.remove('gone');
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    S.origImg=img;S.origW=img.naturalWidth;S.origH=img.naturalHeight;
    S.bgColor='#ffffff';
    setupCanvas();
    spin.classList.add('gone');
    uscreen.classList.add('gone');
    showToast('Image loaded! Start coloring 🎨');
  };
  img.onerror=()=>{spin.classList.add('gone');showToast('Could not load image');};
  img.src=url;
}

// ═══════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════
function setupCanvas(){
  const ww=cwrap.clientWidth,wh=cwrap.clientHeight;
  let dw=S.origW,dh=S.origH;
  const mx=Math.min(DMAX,ww*0.97,wh*0.97);
  if(dw>mx||dh>mx){const r=Math.min(mx/dw,mx/dh);dw=Math.round(dw*r);dh=Math.round(dh*r);}
  S.canvasW=dw;S.canvasH=dh;

  wc.width=dw;wc.height=dh;
  // fill background
  wctx.fillStyle=S.bgColor;
  wctx.fillRect(0,0,dw,dh);
  wctx.drawImage(S.origImg,0,0,dw,dh);

  dc.width=dw;dc.height=dh;
  gc.width=dw;gc.height=dh;
  dc.style.width=dw+'px';dc.style.height=dh+'px';
  gc.style.width=dw+'px';gc.style.height=dh+'px';

  S.zoom=1;S.tx=0;S.ty=0;
  applyXform();
  redraw();
  // reset history
  S.hist=[];S.hi=-1;
  pushHist();
}

function redraw(){
  if(!wc.width)return;
  dctx.clearRect(0,0,dc.width,dc.height);
  dctx.drawImage(wc,0,0);
}

// KEY: only transform dc and gc — NOT the panels
function applyXform(){
  const dw=S.canvasW||0,dh=S.canvasH||0;
  if(!dw)return;
  const z=S.zoom;
  const cx=cwrap.clientWidth/2,cy=cwrap.clientHeight/2;
  const l=cx-dw*z/2+S.tx;
  const t=cy-dh*z/2+S.ty;
  const ts=`translate(${l}px,${t}px) scale(${z})`;
  dc.style.position='absolute';
  dc.style.left='0';dc.style.top='0';
  dc.style.transform=ts;dc.style.transformOrigin='0 0';
  gc.style.position='absolute';
  gc.style.left='0';gc.style.top='0';
  gc.style.transform=ts;gc.style.transformOrigin='0 0';
}

// ═══════════════════════════════════════════════════════
// POINTER → CANVAS COORDS
// ═══════════════════════════════════════════════════════
function p2c(clientX,clientY){
  const dw=S.canvasW,z=S.zoom;
  const dh=S.canvasH;
  const cx=cwrap.clientWidth/2,cy=cwrap.clientHeight/2;
  const l=cx-dw*z/2+S.tx,t=cy-dh*z/2+S.ty;
  const r=cwrap.getBoundingClientRect();
  return{
    x:Math.round((clientX-r.left-l)/z),
    y:Math.round((clientY-r.top-t)/z)
  };
}
function inB(x,y){return x>=0&&y>=0&&x<wc.width&&y<wc.height;}

// ═══════════════════════════════════════════════════════
// FLOOD FILL
// ═══════════════════════════════════════════════════════
function h2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

function floodFill(sx,sy,hex){
  if(!inB(sx,sy))return;
  const id=wctx.getImageData(0,0,wc.width,wc.height);
  const d=id.data,W=wc.width,H=wc.height;
  const [fr,fg,fb]=h2rgb(hex);
  const i0=(sx+sy*W)*4;
  const tr=d[i0],tg=d[i0+1],tb=d[i0+2];
  if(tr<50&&tg<50&&tb<50)return;
  if(tr===fr&&tg===fg&&tb===fb)return;
  const thr=Math.round(S.sensitivity*4.4);
  const vis=new Uint8Array(W*H);
  const stk=[sx+sy*W];vis[stk[0]]=1;
  const fa=Math.round(S.opacity*255);
  while(stk.length){
    const p=stk.pop();
    const x=p%W,y=(p/W)|0,i=p*4;
    // blend with opacity
    d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=fa;
    const nb=[p-1,p+1,p-W,p+W];
    for(let n=0;n<4;n++){
      const np=nb[n];
      if(np<0||np>=W*H||vis[np])continue;
      if(n===0&&x===0)continue;
      if(n===1&&x===W-1)continue;
      vis[np]=1;
      const ni=np*4;
      if(d[ni]<50&&d[ni+1]<50&&d[ni+2]<50)continue;
      if(Math.abs(d[ni]-tr)+Math.abs(d[ni+1]-tg)+Math.abs(d[ni+2]-tb)<=thr)stk.push(np);
    }
  }
  wctx.putImageData(id,0,0);
}

// ═══════════════════════════════════════════════════════
// BRUSH / ERASER
// ═══════════════════════════════════════════════════════
function dot(x,y,r,col,erase){
  wctx.save();
  if(erase){
    // restore to bg color instead of transparent
    wctx.globalCompositeOperation='source-over';
    wctx.fillStyle=S.bgColor||'#ffffff';
  } else {
    wctx.globalCompositeOperation='source-over';
    wctx.globalAlpha=S.opacity;
    wctx.fillStyle=col;
  }
  wctx.beginPath();wctx.arc(x,y,r,0,Math.PI*2);wctx.fill();
  wctx.restore();
}

function strokeLine(x0,y0,x1,y1,r,col,erase){
  const dist=Math.hypot(x1-x0,y1-y0);
  const steps=Math.max(1,Math.ceil(dist/(r/3)));
  for(let i=0;i<=steps;i++)dot(x0+(x1-x0)*i/steps,y0+(y1-y0)*i/steps,r,col,erase);
}

// ═══════════════════════════════════════════════════════
// GLITTER
// ═══════════════════════════════════════════════════════
const GCOL={
  'glitter-gold':()=>`hsl(${40+Math.random()*20},100%,${50+Math.random()*30}%)`,
  'glitter-silver':()=>`hsl(0,0%,${60+Math.random()*38}%)`,
  'glitter-rainbow':()=>`hsl(${Math.random()*360},100%,${55+Math.random()*20}%)`,
};
function spawnGlitter(x,y,type){
  wctx.save();wctx.globalCompositeOperation='source-over';
  for(let i=0;i<14;i++){
    const px=x+(Math.random()-.5)*22,py=y+(Math.random()-.5)*22;
    wctx.fillStyle=GCOL[type]();
    wctx.shadowColor=wctx.fillStyle;wctx.shadowBlur=4;
    wctx.beginPath();wctx.arc(px,py,1+Math.random()*2.5,0,Math.PI*2);wctx.fill();
    S.gp.push({x:px,y:py,vx:(Math.random()-.5)*2.5,vy:(Math.random()-.5)*2.5-1,
      sz:2+Math.random()*3.5,col:GCOL[type](),life:1,dc:0.035+Math.random()*0.04});
  }
  wctx.restore();
  animGlitter();
}
let graf=0;
function animGlitter(){
  cancelAnimationFrame(graf);
  graf=requestAnimationFrame(()=>{
    gctx.clearRect(0,0,gc.width,gc.height);
    S.gp=S.gp.filter(p=>p.life>0);
    S.gp.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=p.dc;
      gctx.save();gctx.globalAlpha=Math.max(0,p.life);
      gctx.fillStyle=p.col;gctx.shadowColor=p.col;gctx.shadowBlur=6;
      gctx.beginPath();gctx.arc(p.x,p.y,p.sz,0,Math.PI*2);gctx.fill();
      gctx.restore();
    });
    if(S.gp.length)animGlitter();else gctx.clearRect(0,0,gc.width,gc.height);
  });
}

function placeSticker(x,y){
  if(!S.selectedSticker)return;
  const size=Math.max(40,Math.min(wc.width,wc.height)*0.12);
  wctx.save();
  wctx.font=`${size}px serif`;
  wctx.textAlign='center';
  wctx.textBaseline='middle';
  wctx.fillText(S.selectedSticker,x,y);
  wctx.restore();
}

// ═══════════════════════════════════════════════════════
// HISTORY — fixed: store snapshots reliably
// ═══════════════════════════════════════════════════════
function pushHist(){
  if(!wc.width)return;
  // remove any redo states
  S.hist=S.hist.slice(0,S.hi+1);
  // clone the imagedata
  const snap=wctx.getImageData(0,0,wc.width,wc.height);
  S.hist.push(snap);
  if(S.hist.length>MAX_HIST)S.hist.shift();
  S.hi=S.hist.length-1;
  updateHbtns();
}

function undo(){
  if(S.hi<=0)return;
  S.hi--;
  wctx.putImageData(S.hist[S.hi],0,0);
  redraw();
  updateHbtns();
  showToast('Undo ↩️');
}
function redo(){
  if(S.hi>=S.hist.length-1)return;
  S.hi++;
  wctx.putImageData(S.hist[S.hi],0,0);
  redraw();
  updateHbtns();
  showToast('Redo ↪️');
}
function updateHbtns(){
  document.getElementById('bundo').classList.toggle('off',S.hi<=0);
  document.getElementById('bredo').classList.toggle('off',S.hi>=S.hist.length-1);
}

document.getElementById('bundo').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();undo();});
document.getElementById('bredo').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();redo();});

document.getElementById('bclear').addEventListener('pointerdown',e=>{

  if(!S.origImg){showToast('Nothing to clear!');return;}
  wctx.fillStyle=S.bgColor||'#ffffff';
  wctx.fillRect(0,0,wc.width,wc.height);

  showToast('Canvas cleared! 🗑️');
});

document.getElementById('bnewimg').addEventListener('pointerdown',e=>{

  S.origImg=null;S.hist=[];S.hi=-1;

  gctx.clearRect(0,0,gc.width,gc.height);
  uscreen.classList.remove('gone');

});

// ═══════════════════════════════════════════════════════
// POINTER EVENTS — cwrap only, panels untouched
// ═══════════════════════════════════════════════════════
cwrap.addEventListener('pointerdown',onDown,{passive:false});
cwrap.addEventListener('pointermove',onMove,{passive:false});
cwrap.addEventListener('pointerup',onUp,{passive:false});
cwrap.addEventListener('pointercancel',onUp,{passive:false});

function onDown(e){
  e.preventDefault();
  // ignore if touching panels (they have their own stop propagation)
  S.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  const n=Object.keys(S.ptrs).length;
  if(n===1&&S.origImg){
    const pt=p2c(e.clientX,e.clientY);
    toolDown(pt,e);
  } else if(n===2){
    if(S.painting)commitPaint();
    const pts=Object.values(S.ptrs);
    S.lastDist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    S.lastMid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
  }
}

function onMove(e){
  e.preventDefault();
  S.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  const n=Object.keys(S.ptrs).length;
  moveBcur(e);
  if(n===1&&S.painting&&S.origImg){
    toolMove(p2c(e.clientX,e.clientY));
  } else if(n===2){
    const pts=Object.values(S.ptrs);
    const dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
    if(S.lastDist)S.zoom=Math.max(0.25,Math.min(10,S.zoom*dist/S.lastDist));
    if(S.lastMid){S.tx+=mid.x-S.lastMid.x;S.ty+=mid.y-S.lastMid.y;}
    S.lastDist=dist;S.lastMid=mid;
    applyXform();
  }
}

function onUp(e){
  e.preventDefault();
  delete S.ptrs[e.pointerId];
  const n=Object.keys(S.ptrs).length;
  if(n<2){S.lastDist=0;S.lastMid=null;}
  if(n===0&&S.painting)commitPaint();
}

function toolDown(pt){
  const t=S.tool;
  if(t==='fill'){
    floodFill(pt.x,pt.y,S.color);
    redraw();pushHist();
  } else if(t==='sticker'){
    if(inB(pt.x,pt.y)){
      placeSticker(pt.x,pt.y);
      redraw();pushHist();
    }
  } else {
    S.painting=true;S.lastPt=pt;
    applyBrush(pt.x,pt.y,pt.x,pt.y);
    redraw();
  }
}

function toolMove(pt){
  if(!S.painting)return;
  applyBrush(S.lastPt.x,S.lastPt.y,pt.x,pt.y);
  S.lastPt=pt;redraw();
}

function commitPaint(){
  S.painting=false;S.lastPt=null;
  pushHist();
}

function applyBrush(x0,y0,x1,y1){
  const t=S.tool;
  if(t==='eraser'){
    strokeLine(x0,y0,x1,y1,20,null,true);
  } else if(BSIZES[t]){
    strokeLine(x0,y0,x1,y1,BSIZES[t]/2,S.color,false);
  } else if(t.startsWith('glitter')){
    if(Math.hypot(x1-x0,y1-y0)>3||x0===x1)spawnGlitter(x1,y1,t);
  }
}

// double-tap zoom
let lastTap=0;
cwrap.addEventListener('touchend',e=>{
  if(e.touches.length>0)return;
  const now=Date.now();
  if(now-lastTap<280){S.zoom>1.5?fitScreen():(S.zoom=2.5,applyXform());}
  lastTap=now;
},{passive:true});

// ═══════════════════════════════════════════════════════
// BRUSH CURSOR
// ═══════════════════════════════════════════════════════
function moveBcur(e){
  const t=S.tool;
  let r=0;
  if(t==='eraser')r=20;
  else if(BSIZES[t])r=BSIZES[t]/2;
  else if(t.startsWith('glitter'))r=14;
  else{bcur.style.display='none';return;}
  const sz=r*2*S.zoom;
  bcur.style.display='block';
  bcur.style.width=sz+'px';
  bcur.style.height=sz+'px';
  bcur.style.left=e.clientX+'px';
  bcur.style.top=e.clientY+'px';
  bcur.style.border='2px solid '+(t==='eraser'?'rgba(255,255,255,.8)':S.color);
  bcur.style.background=t==='eraser'?'rgba(255,255,255,.1)':S.color+'33';
  bcur.style.position='fixed';
  bcur.style.transform='translate(-50%,-50%)';
  bcur.style.pointerEvents='none';
  bcur.style.zIndex='50';
}
cwrap.addEventListener('pointerleave',()=>bcur.style.display='none');

// ═══════════════════════════════════════════════════════
// ZOOM BUTTONS
// ═══════════════════════════════════════════════════════
document.getElementById('bzin').addEventListener('pointerdown',e=>{e.stopPropagation();S.zoom=Math.min(10,S.zoom*1.4);applyXform();});
document.getElementById('bzout').addEventListener('pointerdown',e=>{e.stopPropagation();S.zoom=Math.max(0.25,S.zoom/1.4);applyXform();});
document.getElementById('bfit').addEventListener('pointerdown',e=>{e.stopPropagation();fitScreen();});
document.getElementById('bfit2').addEventListener('pointerdown',e=>{e.stopPropagation();fitScreen();});
function fitScreen(){S.zoom=1;S.tx=0;S.ty=0;applyXform();}

// ═══════════════════════════════════════════════════════
// SAVE — exports at original resolution
// ═══════════════════════════════════════════════════════
document.getElementById('bsave').addEventListener('pointerdown',e=>{
  e.stopPropagation();
  if(!S.origImg){showToast('Open an image first!');return;}
  spin.classList.remove('gone');
  setTimeout(()=>{
    const ex=document.createElement('canvas');
    ex.width=S.origW;ex.height=S.origH;
    const ec=ex.getContext('2d');
    ec.fillStyle=S.bgColor||'#ffffff';
    ec.fillRect(0,0,S.origW,S.origH);
    ec.drawImage(S.origImg,0,0,S.origW,S.origH);
    ec.drawImage(wc,0,0,S.origW,S.origH);
    ex.toBlob(blob=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='rudra-coloring-'+Date.now()+'.png';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      spin.classList.add('gone');
      showToast('Saved! 🎉');
    },'image/png');
  },80);
});

// ═══════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(S.origImg){
      const tmp=wctx.getImageData(0,0,wc.width,wc.height);
      const pw=wc.width,ph=wc.height;
      setupCanvas();
      // scale-paste previous work
      const tc=document.createElement('canvas');
      tc.width=pw;tc.height=ph;
      tc.getContext('2d').putImageData(tmp,0,0);
      wctx.drawImage(tc,0,0,wc.width,wc.height);
      redraw();
    } else {
      applyXform();
    }
  },150);
});

// ═══════════════════════════════════════════════════════
// SOUND EFFECTS
// ═══════════════════════════════════════════════════════
let audioCtx=null;
function getAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playPop(){
  try{
    const a=getAudio();
    const o=a.createOscillator();
    const g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.frequency.setValueAtTime(600,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(300,a.currentTime+0.1);
    g.gain.setValueAtTime(0.15,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);
    o.start();o.stop(a.currentTime+0.15);
  }catch(e){}
}
function playSparkle(){
  try{
    const a=getAudio();
    [0,50,100].forEach(delay=>{
      const o=a.createOscillator();
      const g=a.createGain();
      o.type='sine';
      o.connect(g);g.connect(a.destination);
      const t=a.currentTime+delay/1000;
      o.frequency.setValueAtTime(800+Math.random()*400,t);
      o.frequency.exponentialRampToValueAtTime(1200+Math.random()*400,t+0.08);
      g.gain.setValueAtTime(0.06,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.start(t);o.stop(t+0.1);
    });
  }catch(e){}
}
function playSticker(){
  try{
    const a=getAudio();
    const o=a.createOscillator();
    const g=a.createGain();
    o.type='sine';o.connect(g);g.connect(a.destination);
    o.frequency.setValueAtTime(400,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(800,a.currentTime+0.12);
    g.gain.setValueAtTime(0.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);
    o.start();o.stop(a.currentTime+0.18);
  }catch(e){}
}

// patch toolDown for sounds
const _origToolDown=toolDown;
// override inline — add sounds to actions
const origFloodFill=floodFill;

// wrap fill with sound
cwrap.addEventListener('pointerdown',()=>{
  if(S.tool==='fill')playPop();
  else if(S.tool.startsWith('glitter'))playSparkle();
  else if(S.tool==='sticker')playSticker();
},true);

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>toast.classList.remove('show'),2500);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
applyXform();
updateHbtns();
// init color ring
document.getElementById('cur-color-ring').style.background=S.color;
showToast('Welcome to Rudra! 🎨');
</script>
